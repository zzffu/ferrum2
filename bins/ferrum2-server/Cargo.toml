[package]
name = "ferrum2-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ferrum2-server"
path = "src/main.rs"

[features]
default = []
__frame-size-16k = ["ferrum2-shadowsocks/__frame-size-16k"]
__frame-size-65535 = ["ferrum2-shadowsocks/__frame-size-65535"]
__frame-size-adaptive = ["ferrum2-shadowsocks/__frame-size-adaptive"]
__single-worker-direct-open-diagnostic = [
    "ferrum2-shadowsocks/__single-worker-direct-open-diagnostic",
]
candidate-udp-owned-headroom = [
    "ferrum2-runtime/candidate-udp-owned-headroom",
    "ferrum2-shadowsocks/candidate-udp-owned-headroom",
]
structural-metrics = [
    "dep:ferrum2-structural",
    "ferrum2-dns/structural-metrics",
    "ferrum2-observability/structural-metrics",
    "ferrum2-runtime/structural-metrics",
    "ferrum2-shadowsocks/structural-metrics",
]

[dependencies]
bytes.workspace = true
ferrum2-config.workspace = true
ferrum2-core.workspace = true
ferrum2-crypto.workspace = true
ferrum2-dns.workspace = true
ferrum2-net.workspace = true
ferrum2-observability.workspace = true
ferrum2-runtime.workspace = true
ferrum2-rule.workspace = true
ferrum2-ruleset.workspace = true
ferrum2-shadowsocks = { workspace = true, features = ["tokio"] }
ferrum2-sniff.workspace = true
ferrum2-structural = { workspace = true, optional = true }
ferrum2-platform-windows = { workspace = true, features = ["live-backend"] }
clap.workspace = true
socket2 = { workspace = true, features = ["all"] }
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
hex.workspace = true
hickory-proto.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
