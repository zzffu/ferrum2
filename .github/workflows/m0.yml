name: m3

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/integration/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA
        shell: bash
        run: |
          set -euo pipefail
          if ! status_output="$(git status --porcelain)"; then
            echo "git status failed" >&2
            exit 1
          fi
          test -z "$status_output"
          if ! head_sha="$(git rev-parse HEAD)"; then
            echo "git rev-parse HEAD failed" >&2
            exit 1
          fi
          test "$head_sha" = "$GITHUB_SHA"
      - name: Record provider and toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH image_os=$ImageOS image_version=$ImageVersion"
          uname -a
          rustc -Vv
          cargo -V
          cc --version
          ld --version
      - name: Build binaries and run authoritative full gate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --bins --locked
          cargo build -p ferrum2-shadowsocks --example udp_protocol_client --locked
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test -p ferrum2-m0-harness --test lifecycle_cycles full_qualification_runs_twenty_cycles_per_category_and_at_least_100_per_binary --locked -- --ignored --exact --nocapture
          cargo doc --workspace --all-features --no-deps --locked
      - name: Record authoritative full-gate completion
        shell: bash
        run: |
          set -euo pipefail
          printf 'm3_full_completion status=PASS full=PASS security=PASS process=PASS sha=%s run_id=%s run_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Prove focused IPv6 UDP real-process path
        shell: bash
        run: |
          set -euo pipefail
          test_name=ipv4_ingress_ipv6_direct_target_round_trips_three_datagrams_and_reaps
          expected_listing="$test_name: test"
          list_output="$(cargo test -p ferrum2-m0-harness --test udp_local_e2e --locked -- --ignored --list)"
          listing_count="$(grep -Fxc "$expected_listing" <<<"$list_output" || true)"
          if [ "$listing_count" -ne 1 ]; then
            echo "focused IPv6 UDP test selection count was $listing_count, expected 1" >&2
            exit 1
          fi

          test_status=0
          test_output="$(
            timeout --signal=TERM --kill-after=10s 2m \
              cargo test -p ferrum2-m0-harness --test udp_local_e2e \
                "$test_name" --locked -- --ignored --exact --nocapture 2>&1
          )" || test_status=$?
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            echo "focused IPv6 UDP test failed with status $test_status" >&2
            exit 1
          fi

          product_marker="m2_ipv6_udp_real_process status=PASS datagrams=3 payload=PASS source=PASS cleanup=PASS"
          product_marker_count="$(grep -Fxc "$product_marker" <<<"$test_output" || true)"
          if [ "$product_marker_count" -ne 1 ]; then
            echo "focused IPv6 UDP product marker count was $product_marker_count, expected 1" >&2
            exit 1
          fi
          result_count="$(grep -Ec '^test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured;' <<<"$test_output" || true)"
          if [ "$result_count" -ne 1 ]; then
            echo "focused IPv6 UDP executed-test count was not exactly 1" >&2
            exit 1
          fi
          printf 'm2_ipv6_udp_real_process_completion status=PASS sha=%s run_id=%s run_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

  budget:
    name: test-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Enforce milestone test envelope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          cargo install --locked rustloc --version '=0.19.1' --root "$RUNNER_TEMP/rustloc"
          rustloc_bin="$RUNNER_TEMP/rustloc/bin/rustloc"
          test "$("$rustloc_bin" --version)" = "rustloc 0.19.1"

          base=""
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BASE_SHA" ;;
          esac
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              RUSTLOC="$rustloc_bin" sh scripts/test-budget.sh ci \
                --candidate "$GITHUB_SHA"
              ;;
            *)
              RUSTLOC="$rustloc_bin" sh scripts/test-budget.sh ci \
                --base "$base" --candidate "$GITHUB_SHA"
              ;;
          esac
          printf 'test_budget_completion status=PASS schema=2 sha=%s run_id=%s run_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

  msrv:
    name: msrv
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA
        shell: bash
        run: |
          set -euo pipefail
          if ! status_output="$(git status --porcelain)"; then
            echo "git status failed" >&2
            exit 1
          fi
          test -z "$status_output"
          if ! head_sha="$(git rev-parse HEAD)"; then
            echo "git rev-parse HEAD failed" >&2
            exit 1
          fi
          test "$head_sha" = "$GITHUB_SHA"
      - name: Record provider evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH image_os=$ImageOS image_version=$ImageVersion"
          uname -a
          cc --version
          ld --version
      - name: Install and prove MSRV
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustc +1.85.0 -Vv
          cargo +1.85.0 -V
          cargo +1.85.0 check --workspace --all-targets --locked
          cargo +1.85.0 build --workspace --bins --locked
          cargo +1.85.0 test --workspace --locked

  platform:
    name: platform / ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: windows-msvc
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - profile: linux-gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - profile: linux-musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA on Windows
        if: matrix.profile == 'windows-msvc'
        shell: pwsh
        run: |
          $statusOutput = git status --porcelain
          if ($LASTEXITCODE -ne 0) { throw "git status failed" }
          if ($statusOutput) { throw "checkout is not clean" }
          $headSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse HEAD failed" }
          if ($headSha -ne $env:GITHUB_SHA) { throw "HEAD is not GITHUB_SHA" }
      - name: Verify clean current SHA on Linux
        if: matrix.profile != 'windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          if ! status_output="$(git status --porcelain)"; then
            echo "git status failed" >&2
            exit 1
          fi
          test -z "$status_output"
          if ! head_sha="$(git rev-parse HEAD)"; then
            echo "git rev-parse HEAD failed" >&2
            exit 1
          fi
          test "$head_sha" = "$GITHUB_SHA"
      - name: Record Windows provider evidence
        if: matrix.profile == 'windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "run_id=$env:GITHUB_RUN_ID run_attempt=$env:GITHUB_RUN_ATTEMPT job=$env:GITHUB_JOB sha=$env:GITHUB_SHA"
          Write-Output "profile=${{ matrix.profile }} target=${{ matrix.target }} runner=$env:RUNNER_OS/$env:RUNNER_ARCH image_os=$env:ImageOS image_version=$env:ImageVersion"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere is missing" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "VS 2022 C++ tools not found" }
          $tools = Get-ChildItem "$installation\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $cl = Join-Path $tools.FullName "bin\Hostx64\x64\cl.exe"
          $link = Join-Path $tools.FullName "bin\Hostx64\x64\link.exe"
          if (-not (Test-Path -LiteralPath $cl -PathType Leaf) -or -not (Test-Path -LiteralPath $link -PathType Leaf)) {
            throw "resolved MSVC tools are missing"
          }
          Write-Output "vs_installation=$installation"
          Write-Output "compiler=$cl version=$((Get-Item -LiteralPath $cl).VersionInfo.FileVersion)"
          Write-Output "linker=$link version=$((Get-Item -LiteralPath $link).VersionInfo.FileVersion)"
      - name: Record Linux provider evidence
        if: matrix.profile != 'windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "profile=${{ matrix.profile }} target=${{ matrix.target }} runner=$RUNNER_OS/$RUNNER_ARCH image_os=$ImageOS image_version=$ImageVersion"
          uname -a
          cc --version
          ld --version
      - name: Record GNU host glibc identity
        if: matrix.profile == 'linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          ldd --version
      - name: Build and run native Windows artifacts
        if: matrix.profile == 'windows-msvc'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 ${{ matrix.target }}
          rustc +1.97.1 -Vv
          cargo +1.97.1 -V
          cargo +1.97.1 build --workspace --bins --release --locked --target ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw "MSVC release build failed" }
          $client = "target\${{ matrix.target }}\release\ferrum2-client.exe"
          $server = "target\${{ matrix.target }}\release\ferrum2-server.exe"
          $qualificationOutput = & python -X utf8 tests\platform\qualify_native.py `
            --profile '${{ matrix.profile }}' --target '${{ matrix.target }}' `
            --client $client --server $server 2>&1 | Out-String
          $qualificationStatus = $LASTEXITCODE
          Write-Output $qualificationOutput.TrimEnd()
          if ($qualificationStatus -ne 0) { throw "MSVC native qualification failed" }
          $artifactCount = ([regex]::Matches($qualificationOutput, "(?m)^m3_release_artifact status=PASS ")).Count
          $lifecycleCount = ([regex]::Matches($qualificationOutput, "(?m)^m3_native_lifecycle_completion status=PASS ")).Count
          if ($artifactCount -ne 2 -or $lifecycleCount -ne 2) {
            throw "MSVC native evidence marker count mismatch"
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere is missing" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "VS 2022 C++ tools not found" }
          $tools = Get-ChildItem "$installation\VC\Tools\MSVC" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $tools.FullName "bin\Hostx64\x64\dumpbin.exe"
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) { throw "dumpbin is missing" }
          foreach ($entry in @(
            @{ Name = "ferrum2-client"; Path = $client },
            @{ Name = "ferrum2-server"; Path = $server }
          )) {
            $headers = & $dumpbin /headers $entry.Path | Out-String
            if ($LASTEXITCODE -ne 0 -or $headers -notmatch "8664 machine \(x64\)") {
              throw "$($entry.Name) is not an x64 PE image"
            }
            Write-Output $headers.TrimEnd()
            $dependents = & $dumpbin /dependents $entry.Path | Out-String
            if ($LASTEXITCODE -ne 0 -or $dependents -notmatch "Image has the following dependencies") {
              throw "$($entry.Name) PE dependents are missing"
            }
            Write-Output $dependents.TrimEnd()
            Write-Output "m3_linkage status=PASS profile=${{ matrix.profile }} target=${{ matrix.target }} binary=$($entry.Name) format=PE arch=x86_64 headers=PASS dependents=PASS"
          }
          Write-Output "m3_platform_completion status=PASS profile=${{ matrix.profile }} target=${{ matrix.target }} native=2/2 artifacts=2/2 linkage=2/2 cleanup=PASS sha=$env:GITHUB_SHA run_id=$env:GITHUB_RUN_ID run_attempt=$env:GITHUB_RUN_ATTEMPT"

          cargo +1.97.1 build --workspace --bins --locked
          if ($LASTEXITCODE -ne 0) { throw "native detection binary build failed" }
          cargo +1.97.1 test -p ferrum2-m0-harness --test detection_probe --locked
          if ($LASTEXITCODE -ne 0) { throw "native detection evidence failed" }
      - name: Build and run native GNU artifacts
        if: matrix.profile == 'linux-gnu'
        shell: bash
        env:
          CC_x86_64_unknown_linux_gnu: /usr/bin/gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: /usr/bin/gcc
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 "${{ matrix.target }}"
          rustc +1.97.1 -Vv
          cargo +1.97.1 -V
          cargo +1.97.1 build --workspace --bins --release --locked --target "${{ matrix.target }}"
          client="target/${{ matrix.target }}/release/ferrum2-client"
          server="target/${{ matrix.target }}/release/ferrum2-server"
          qualification_status=0
          qualification_output="$(
            python -X utf8 tests/platform/qualify_native.py \
              --profile '${{ matrix.profile }}' --target '${{ matrix.target }}' \
              --client "$client" --server "$server" 2>&1
          )" || qualification_status=$?
          printf '%s\n' "$qualification_output"
          test "$qualification_status" -eq 0
          test "$(grep -Ec '^m3_release_artifact status=PASS ' <<<"$qualification_output" || true)" -eq 2
          test "$(grep -Ec '^m3_native_lifecycle_completion status=PASS ' <<<"$qualification_output" || true)" -eq 2
          for entry in "ferrum2-client:$client" "ferrum2-server:$server"; do
            name="${entry%%:*}"
            binary="${entry#*:}"
            file_output="$(file "$binary")"
            printf '%s\n' "$file_output"
            grep -Eq 'ELF 64-bit LSB (pie )?executable, x86-64' <<<"$file_output"
            header_output="$(readelf -hW "$binary")"
            program_output="$(readelf -lW "$binary")"
            dynamic_output="$(readelf -dW "$binary")"
            objdump_output="$(objdump -p "$binary")"
            printf '%s\n%s\n%s\n%s\n' \
              "$header_output" "$program_output" "$dynamic_output" "$objdump_output"
            grep -Fq 'Class:                             ELF64' <<<"$header_output"
            grep -Fq 'Machine:                           Advanced Micro Devices X86-64' <<<"$header_output"
            grep -q 'Requesting program interpreter:' <<<"$program_output"
            grep -q '(NEEDED)' <<<"$dynamic_output"
            glibc_requirements="$(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -Vu)"
            test -n "$glibc_requirements"
            printf '%s\n' "$glibc_requirements"
            printf 'm3_linkage status=PASS profile=%s target=%s binary=%s format=ELF arch=x86_64 interp=PASS needed=PASS glibc=PASS\n' \
              '${{ matrix.profile }}' '${{ matrix.target }}' "$name"
          done
          printf 'm3_platform_completion status=PASS profile=%s target=%s native=2/2 artifacts=2/2 linkage=2/2 cleanup=PASS sha=%s run_id=%s run_attempt=%s\n' \
            '${{ matrix.profile }}' '${{ matrix.target }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

          cargo +1.97.1 build --workspace --bins --locked
          cargo +1.97.1 test -p ferrum2-m0-harness --test detection_probe --locked
      - name: Install exact musl packages
        if: matrix.profile == 'linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl=1.2.4-2 musl-dev=1.2.4-2 musl-tools=1.2.4-2
          test "$(dpkg-query -W -f='${Version}' musl)" = "1.2.4-2"
          test "$(dpkg-query -W -f='${Version}' musl-dev)" = "1.2.4-2"
          test "$(dpkg-query -W -f='${Version}' musl-tools)" = "1.2.4-2"
          dpkg-query -W musl musl-dev musl-tools
          musl-gcc --version
      - name: Build run and assert static musl artifacts
        if: matrix.profile == 'linux-musl'
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: /usr/bin/musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: /usr/bin/musl-gcc
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 "${{ matrix.target }}"
          rustc +1.97.1 -Vv
          cargo +1.97.1 -V
          cargo +1.97.1 build --workspace --bins --release --locked --target "${{ matrix.target }}"
          client="target/${{ matrix.target }}/release/ferrum2-client"
          server="target/${{ matrix.target }}/release/ferrum2-server"
          qualification_status=0
          qualification_output="$(
            python -X utf8 tests/platform/qualify_native.py \
              --profile '${{ matrix.profile }}' --target '${{ matrix.target }}' \
              --client "$client" --server "$server" 2>&1
          )" || qualification_status=$?
          printf '%s\n' "$qualification_output"
          test "$qualification_status" -eq 0
          test "$(grep -Ec '^m3_release_artifact status=PASS ' <<<"$qualification_output" || true)" -eq 2
          test "$(grep -Ec '^m3_native_lifecycle_completion status=PASS ' <<<"$qualification_output" || true)" -eq 2
          for entry in "ferrum2-client:$client" "ferrum2-server:$server"; do
            name="${entry%%:*}"
            binary="${entry#*:}"
            file_output="$(file "$binary")"
            echo "$file_output"
            echo "$file_output" | grep -Eq 'statically linked|static-pie linked'
            header_output="$(readelf -hW "$binary")"
            program_output="$(readelf -lW "$binary")"
            dynamic_output="$(readelf -dW "$binary")"
            printf '%s\n%s\n%s\n' "$header_output" "$program_output" "$dynamic_output"
            grep -Fq 'Class:                             ELF64' <<<"$header_output"
            grep -Fq 'Machine:                           Advanced Micro Devices X86-64' <<<"$header_output"
            if grep -q 'INTERP' <<<"$program_output"; then
              echo "PT_INTERP is forbidden" >&2
              exit 1
            fi
            if grep -q 'NEEDED' <<<"$dynamic_output"; then
              echo "DT_NEEDED is forbidden" >&2
              exit 1
            fi
            printf 'm3_linkage status=PASS profile=%s target=%s binary=%s format=ELF arch=x86_64 static=PASS pt_interp=ABSENT dt_needed=ABSENT\n' \
              '${{ matrix.profile }}' '${{ matrix.target }}' "$name"
          done
          printf 'm3_platform_completion status=PASS profile=%s target=%s native=2/2 artifacts=2/2 linkage=2/2 cleanup=PASS sha=%s run_id=%s run_attempt=%s\n' \
            '${{ matrix.profile }}' '${{ matrix.target }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"

  interop:
    name: interop
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA
        shell: bash
        run: |
          set -euo pipefail
          if ! status_output="$(git status --porcelain)"; then
            echo "git status failed" >&2
            exit 1
          fi
          test -z "$status_output"
          if ! head_sha="$(git rev-parse HEAD)"; then
            echo "git rev-parse HEAD failed" >&2
            exit 1
          fi
          test "$head_sha" = "$GITHUB_SHA"
      - name: Record provider and toolchain evidence
        shell: bash
        run: |
          set -euo pipefail
          echo "run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB sha=$GITHUB_SHA"
          echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH image_os=$ImageOS image_version=$ImageVersion"
          uname -a
          rustc -Vv
          cargo -V
          cc --version
          ld --version
      - name: Provision both pinned references independently
        shell: bash
        run: |
          set -euo pipefail
          sing_box_status=0
          timeout --signal=TERM --kill-after=10s 5m \
            bash -euo pipefail <<'SING_BOX_SETUP' || sing_box_status=$?
          archive="$RUNNER_TEMP/sing-box-1.13.14-linux-amd64-glibc.tar.gz"
          directory="$RUNNER_TEMP/sing-box-1.13.14"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/SagerNet/sing-box/releases/download/v1.13.14/sing-box-1.13.14-linux-amd64-glibc.tar.gz
          test "$(stat --format='%s' "$archive")" = "24614103"
          echo "aae9172317c61760aae3dafcde889b2e51b7ea590c40d2b3c7ccdeae14b361b6  $archive" | sha256sum -c -
          diff -u <(printf '%s\n' \
            'sing-box-1.13.14-linux-amd64-glibc/' \
            'sing-box-1.13.14-linux-amd64-glibc/LICENSE' \
            'sing-box-1.13.14-linux-amd64-glibc/sing-box') <(tar -tzf "$archive")
          mkdir "$directory"
          tar -xzf "$archive" -C "$directory"
          binary="$directory/sing-box-1.13.14-linux-amd64-glibc/sing-box"
          license="$directory/sing-box-1.13.14-linux-amd64-glibc/LICENSE"
          test -x "$binary"
          test -s "$license"
          test "$(stat --format='%s' "$license")" -le 262144
          version_output="$("$binary" version)"
          grep -F 'sing-box version 1.13.14' <<<"$version_output"
          grep -F 'Revision: 25a600db24f7680ad9806ce5427bd0ab8afe1114' <<<"$version_output"
          grep -F 'source_commit = "25a600db24f7680ad9806ce5427bd0ab8afe1114"' tests/interop/versions.toml
          grep -F 'license_review = "GPL-3.0-or-later with additional name terms; GitHub SPDX NOASSERTION; execute only as an independent test process; do not redistribute"' tests/interop/versions.toml
          SING_BOX_SETUP

          shadowsocks_rust_status=0
          timeout --signal=TERM --kill-after=10s 5m \
            bash -euo pipefail <<'SHADOWSOCKS_RUST_SETUP' || shadowsocks_rust_status=$?
          archive="$RUNNER_TEMP/shadowsocks-v1.24.0.x86_64-unknown-linux-gnu.tar.xz"
          directory="$RUNNER_TEMP/shadowsocks-rust-1.24.0"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/shadowsocks/shadowsocks-rust/releases/download/v1.24.0/shadowsocks-v1.24.0.x86_64-unknown-linux-gnu.tar.xz
          test "$(stat --format='%s' "$archive")" = "11635096"
          echo "5f528efb4e51e732352f5c69538dcc76e8cf8f6d1a240dfb5b748a67f0b05f65  $archive" | sha256sum -c -
          diff -u <(printf '%s\n' sslocal ssserver ssurl ssmanager ssservice) <(tar -tJf "$archive")
          mkdir "$directory"
          tar -xJf "$archive" -C "$directory"
          test -x "$directory/sslocal"
          test -x "$directory/ssserver"
          "$directory/sslocal" --version | grep -Fx 'shadowsocks 1.24.0'
          "$directory/ssserver" --version | grep -Fx 'shadowsocks 1.24.0'
          grep -F 'source_commit = "7ee1aa9223ed8f4d34734aac919036c8ad4502c2"' tests/interop/versions.toml
          grep -F 'license_review = "MIT; execute only as an independent test process; do not redistribute"' tests/interop/versions.toml
          SHADOWSOCKS_RUST_SETUP

          if [ "$sing_box_status" -ne 0 ]; then
            echo "sing-box provider setup failed; qualification will report its provision root" >&2
          fi
          if [ "$shadowsocks_rust_status" -ne 0 ]; then
            echo "shadowsocks-rust provider setup failed; qualification will report its provision root" >&2
          fi
          echo "provider_setup sing_box=$sing_box_status shadowsocks_rust=$shadowsocks_rust_status"
          {
            printf 'M2_SING_BOX_SETUP_STATUS=%s\n' "$sing_box_status"
            printf 'M2_SHADOWSOCKS_RUST_SETUP_STATUS=%s\n' "$shadowsocks_rust_status"
          } >> "$GITHUB_ENV"
      - name: Run hosted M1 TCP and M2 UDP qualification
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR
          CARGO_TARGET_DIR="$(mktemp -d "$RUNNER_TEMP/m1-tcp-m2-udp-qualification-target.XXXXXX")"
          cargo build --workspace --bins --locked
          cargo build -p ferrum2-shadowsocks --example udp_protocol_client --locked
          cargo build -p ferrum2-m0-harness --bin m0-qualification --locked
          qualification_status=0
          qualification_output="$("$CARGO_TARGET_DIR/debug/m0-qualification" 2>&1)" || qualification_status=$?
          printf '%s\n' "$qualification_output"

          sing_box_status="${M2_SING_BOX_SETUP_STATUS:-}"
          shadowsocks_rust_status="${M2_SHADOWSOCKS_RUST_SETUP_STATUS:-}"
          case "$sing_box_status" in
            ''|*[!0-9]*) echo "invalid persisted sing-box setup status" >&2; exit 1 ;;
          esac
          case "$shadowsocks_rust_status" in
            ''|*[!0-9]*) echo "invalid persisted shadowsocks-rust setup status" >&2; exit 1 ;;
          esac
          cleanup_status=0
          rm -rf -- "$CARGO_TARGET_DIR" || cleanup_status=$?
          if [ -e "$CARGO_TARGET_DIR" ]; then
            cleanup_status=1
          fi
          expected_tcp="qualification transport=tcp status=PASS cases=12/12 cleanup=PASS sha=$GITHUB_SHA run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT"
          expected_udp="qualification transport=udp status=PASS cases=12/12 cleanup=PASS sha=$GITHUB_SHA run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT"
          tcp_count="$(grep -Fxc "$expected_tcp" <<<"$qualification_output" || true)"
          udp_count="$(grep -Fxc "$expected_udp" <<<"$qualification_output" || true)"
          echo "final_status sing_box=$sing_box_status shadowsocks_rust=$shadowsocks_rust_status qualification=$qualification_status cleanup=$cleanup_status"
          if [ "$sing_box_status" -eq 0 ] &&
             [ "$shadowsocks_rust_status" -eq 0 ] &&
             [ "$qualification_status" -eq 0 ] &&
             [ "$cleanup_status" -eq 0 ] &&
             [ "$tcp_count" -eq 1 ] &&
             [ "$udp_count" -eq 1 ]; then
            printf 'm3_interop_completion status=PASS tcp=12/12 tcp_cleanup=PASS udp=12/12 udp_cleanup=PASS sha=%s run_id=%s run_attempt=%s\n' \
              "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            exit 0
          fi
          exit 1

  performance:
    name: performance
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify M4 hosted profile
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          test "$ImageOS" = "ubuntu24"
          test "$GITHUB_EVENT_NAME" = "push" || test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test ! -e "$RUNNER_TEMP/m4"
          for process in ferrum2-client ferrum2-server sslocal ssserver; do
            ! pgrep -x "$process" >/dev/null
          done

          ulimit -S -n 65536
          test "$(ulimit -S -n)" = "65536"
          cpu_count="$(getconf _NPROCESSORS_ONLN)"
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          runner_temp_free_kib="$(df -Pk "$RUNNER_TEMP" | awk 'END { print $4 }')"
          test "$cpu_count" -ge 4
          test "$memory_kib" -ge 15000000
          test "$runner_temp_free_kib" -ge 6000000

          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 --version | grep -Fx 'rustc 1.97.1 (8bab26f4f 2026-07-14)'
          cargo +1.97.1 -V
          cc --version
          ld --version
          uname -a
          printf 'm4_profile status=PASS cpu_count=%s memory_kib=%s runner_temp_free_kib=%s nofile=65536 image_os=%s image_version=%s sha=%s run_id=%s run_attempt=%s\n' \
            "$cpu_count" "$memory_kib" "$runner_temp_free_kib" "$ImageOS" "$ImageVersion" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Run M4 throughput and resource qualification
        shell: bash
        run: |
          set -euo pipefail
          ulimit -S -n 65536
          work="$RUNNER_TEMP/m4"
          archive="$work/shadowsocks-v1.24.0.x86_64-unknown-linux-gnu.tar.xz"
          reference="$work/reference"
          mkdir -p "$reference"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/shadowsocks/shadowsocks-rust/releases/download/v1.24.0/shadowsocks-v1.24.0.x86_64-unknown-linux-gnu.tar.xz
          test "$(stat --format='%s' "$archive")" = "11635096"
          echo "5f528efb4e51e732352f5c69538dcc76e8cf8f6d1a240dfb5b748a67f0b05f65  $archive" | sha256sum -c -
          diff -u <(printf '%s\n' sslocal ssserver ssurl ssmanager ssservice) <(tar -tJf "$archive")
          tar -xJf "$archive" -C "$reference"
          test -x "$reference/sslocal"
          test -x "$reference/ssserver"
          "$reference/sslocal" --version | grep -Fx 'shadowsocks 1.24.0'
          "$reference/ssserver" --version | grep -Fx 'shadowsocks 1.24.0'
          grep -F 'source_commit = "7ee1aa9223ed8f4d34734aac919036c8ad4502c2"' tests/interop/versions.toml
          grep -F 'license_review = "MIT; execute only as an independent test process; do not redistribute"' tests/interop/versions.toml

          cargo +1.97.1 build --workspace --bins --release --locked
          throughput_output="$(target/release/m4-qualification throughput \
            --sha "$GITHUB_SHA" \
            --sslocal "$reference/sslocal" \
            --ssserver "$reference/ssserver" \
            --output "$work/throughput.jsonl")"
          printf '%s\n' "$throughput_output"
          test "$(grep -Ec '^m4_throughput_completion status=PASS ' <<<"$throughput_output" || true)" -eq 1
          test "$(grep -c '^' <<<"$throughput_output")" -eq 1
          grep -Fq " trials=10 sha=$GITHUB_SHA run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT" <<<"$throughput_output"
          ferrum_median="$(sed -n 's/^m4_throughput_completion status=PASS ferrum_median=\([0-9][0-9]*\) .*/\1/p' <<<"$throughput_output")"
          reference_median="$(sed -n 's/.* reference_median=\([0-9][0-9]*\) .*/\1/p' <<<"$throughput_output")"
          ratio="$(sed -n 's/.* ratio=\([0-9][0-9]*\.[0-9][0-9]*\) .*/\1/p' <<<"$throughput_output")"
          signed_difference="$(sed -n 's/.*"signed_difference_percent":\(-\{0,1\}[0-9][0-9]*\.[0-9][0-9]*\),.*/\1/p' "$work/throughput.jsonl")"
          grep -Eq '^[1-9][0-9]*$' <<<"$ferrum_median"
          grep -Eq '^[1-9][0-9]*$' <<<"$reference_median"
          grep -Eq '^[0-9]+\.[0-9]{9}$' <<<"$ratio"
          grep -Eq '^-?[0-9]+\.[0-9]{9}$' <<<"$signed_difference"

          thp_knob=/sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none
          thp_original_file="$work/thp-max-ptes-none.original"
          restore_thp() {
            trap - EXIT TERM
            restore_status=0
            thp_original=
            if ! thp_original="$(cat "$thp_original_file")"; then
              restore_status=1
            elif ! grep -Eq '^(0|[1-9][0-9]*)$' <<<"$thp_original"; then
              restore_status=1
            else
              printf '%s\n' "$thp_original" | sudo -n tee "$thp_knob" >/dev/null || restore_status=1
              test "$(cat "$thp_knob")" = "$thp_original" || restore_status=1
            fi
            if [ "$restore_status" -ne 0 ]; then
              printf '%s\n' 'm4_thp_profile status=ERROR phase=restore' >&2
            fi
            return "$restore_status"
          }
          finish_thp() {
            primary="$1"
            restore_status=0
            restore_thp || restore_status=$?
            if [ "$primary" -ne 0 ]; then
              exit "$primary"
            fi
            exit "$restore_status"
          }
          thp_original="$(cat "$thp_knob")"
          grep -Eq '^(0|[1-9][0-9]*)$' <<<"$thp_original"
          printf '%s\n' "$thp_original" >"$thp_original_file"
          test "$(cat "$thp_original_file")" = "$thp_original"
          trap 'finish_thp "$?"' EXIT
          trap 'finish_thp 143' TERM
          printf '0\n' | sudo -n tee "$thp_knob" >/dev/null
          test "$(cat "$thp_knob")" = 0
          printf '%s\n' 'm4_thp_profile status=APPLIED max_ptes_none=0'

          resource_output="$(target/release/m4-qualification resource \
            --sha "$GITHUB_SHA" \
            --output "$work/resource.jsonl")"
          printf '%s\n' "$resource_output"
          expected_resource="m4_resource_completion status=PASS sessions=10000 samples=180 rss_windows=6/6 drain=PASS sha=$GITHUB_SHA run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT"
          test "$resource_output" = "$expected_resource"
          restore_thp
          trap - EXIT TERM
          printf '%s\n' 'm4_thp_profile status=RESTORED readback=PASS'
          printf 'm4_performance_completion status=PASS ferrum_median=%s reference_median=%s ratio=%s signed_difference_percent=%s sessions=10000 samples=180 rss_windows=6/6 drain=PASS sha=%s run_id=%s run_attempt=%s\n' \
            "$ferrum_median" "$reference_median" "$ratio" "$signed_difference" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Reap M4 processes and delete generated evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          for signal in TERM KILL; do
            for process in ferrum2-client ferrum2-server sslocal ssserver; do
              signal_status=0
              pkill "-$signal" -x "$process" 2>/dev/null || signal_status=$?
              if [ "$signal_status" -gt 1 ]; then
                cleanup_status=1
              fi
            done
            sleep 1
          done
          for process in ferrum2-client ferrum2-server sslocal ssserver; do
            if pgrep -x "$process" >/dev/null; then
              cleanup_status=1
            fi
          done
          thp_knob=/sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none
          thp_original_file="$RUNNER_TEMP/m4/thp-max-ptes-none.original"
          if [ -e "$thp_original_file" ]; then
            thp_original=
            if ! thp_original="$(cat "$thp_original_file")"; then
              cleanup_status=1
            elif ! grep -Eq '^(0|[1-9][0-9]*)$' <<<"$thp_original"; then
              cleanup_status=1
            else
              printf '%s\n' "$thp_original" | sudo -n tee "$thp_knob" >/dev/null || cleanup_status=1
              test "$(cat "$thp_knob")" = "$thp_original" || cleanup_status=1
            fi
          fi
          if [ -e "$RUNNER_TEMP/m4" ]; then
            rm -rf -- "$RUNNER_TEMP/m4" || cleanup_status=1
          fi
          if [ -e "$RUNNER_TEMP/m4" ]; then
            cleanup_status=1
          fi
          test "$cleanup_status" -eq 0

  qualification:
    name: qualification
    if: ${{ always() }}
    needs:
      - quality
      - budget
      - msrv
      - platform
      - interop
      - performance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Fail closed and record same-run M3 qualification
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUDGET_RESULT: ${{ needs.budget.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          INTEROP_RESULT: ${{ needs.interop.result }}
          PERFORMANCE_RESULT: ${{ needs.performance.result }}
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$QUALITY_RESULT" = "success"
          test "$BUDGET_RESULT" = "success"
          test "$MSRV_RESULT" = "success"
          test "$PLATFORM_RESULT" = "success"
          test "$INTEROP_RESULT" = "success"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$PERFORMANCE_RESULT" = "skipped"
            performance=SKIPPED
          else
            test "$PERFORMANCE_RESULT" = "success"
            performance=PASS
          fi
          printf 'm3_qualification_completion status=PASS full=PASS security=PASS process=PASS msrv=PASS tcp=12/12 tcp_cleanup=PASS udp=12/12 udp_cleanup=PASS platforms=3/3 test_budget=PASS sha=%s run_id=%s run_attempt=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          printf 'm4_qualification_completion status=PASS performance=%s full=PASS security=PASS process=PASS msrv=PASS tcp=12/12 tcp_cleanup=PASS udp=12/12 udp_cleanup=PASS platforms=3/3 test_budget=PASS sha=%s run_id=%s run_attempt=%s\n' \
            "$performance" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
