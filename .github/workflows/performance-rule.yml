name: performance-rule

on:
  workflow_call:
    inputs:
      stage:
        description: "Collect same-binary calibration or compare one reviewed candidate"
        required: true
        type: string
      candidate_sha:
        description: "Exact full commit SHA containing the candidate and this workflow"
        required: true
        type: string
      calibration_run_id:
        description: "Successful calibration caller run ID (comparison only)"
        required: false
        type: number
        default: 0
      reviewed_by:
        description: "Explicit calibration reviewer identity (comparison only)"
        required: false
        type: string
        default: ""
      reviewed_utc:
        description: "Explicit calibration review time as YYYY-MM-DDTHH:MM:SSZ"
        required: false
        type: string
        default: ""
      candidate_feature:
        description: "Default-off candidate compiled only for comparison"
        required: false
        type: string
        default: domain
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact full commit SHA containing the candidate and this workflow"
        required: true
        type: string
      stage:
        description: "Collect same-binary calibration or compare one reviewed candidate"
        required: true
        type: choice
        default: calibration-aa
        options:
          - calibration-aa
          - comparison
      calibration_run_id:
        description: "Successful performance-rule calibration workflow run ID (comparison only)"
        required: false
        type: number
        default: 0
      reviewed_by:
        description: "Explicit calibration reviewer identity (comparison only)"
        required: false
        type: string
      reviewed_utc:
        description: "Explicit calibration review time as YYYY-MM-DDTHH:MM:SSZ (comparison only)"
        required: false
        type: string
      candidate_feature:
        description: "Default-off candidate compiled only for comparison"
        required: true
        type: choice
        default: domain
        options:
          - domain
          - cidr
          - atomic
          - all

permissions:
  actions: read
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.97.1"
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}

jobs:
  invocation:
    name: invocation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      STAGE: ${{ inputs.stage }}
      CALIBRATION_RUN_ID: ${{ inputs.calibration_run_id }}
      REVIEWED_BY: ${{ inputs.reviewed_by }}
      REVIEWED_UTC: ${{ inputs.reviewed_utc }}
      FEATURE_KEY: ${{ inputs.candidate_feature }}
    steps:
      - name: Validate exact reusable workflow inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$STAGE" in
            calibration-aa)
              test "$CALIBRATION_RUN_ID" = 0
              test -z "$REVIEWED_BY" && test -z "$REVIEWED_UTC"
              ;;
            comparison)
              [[ "$CALIBRATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              test -n "$REVIEWED_BY" && test -n "$REVIEWED_UTC"
              [[ "$FEATURE_KEY" =~ ^(domain|cidr|atomic|all)$ ]]
              ;;
            *) exit 2 ;;
          esac

  calibration-aa:
    name: calibration-aa
    needs: invocation
    if: ${{ inputs.stage == 'calibration-aa' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact calibration source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Initialize calibration evidence paths
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/performance-rule/calibration"
          parent_target="$RUNNER_TEMP/performance-rule/parent-target"
          parent_binary="$evidence/parent/ferrum2-rule-qualification"
          mkdir -p "$evidence/parent"
          {
            printf 'CALIBRATION_EVIDENCE=%s\n' "$evidence"
            printf 'PARENT_TARGET=%s\n' "$parent_target"
            printf 'PARENT_BINARY=%s\n' "$parent_binary"
            printf 'AA_REPORT=%s\n' "$evidence/release-aa-v7.json"
            printf 'HOST_IDENTITY=%s\n' "$evidence/host-identity.json"
          } >>"$GITHUB_ENV"

      - name: Require exact clean source and AMD host identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git status --porcelain=v1 --untracked-files=normal)" = ""
          python3 -B -m tools.ci.performance_rule_workflow capture-host \
            --output "$HOST_IDENTITY"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc +1.97.1 -Vv

      - name: Build feature-free calibrated parent
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$PARENT_TARGET"
          cargo +1.97.1 build --release --locked \
            -p ferrum2-rule-qualification \
            --no-default-features \
            --target-dir "$PARENT_TARGET"
          install -m 0755 \
            "$PARENT_TARGET/release/ferrum2-rule-qualification" \
            "$PARENT_BINARY"
          test -x "$PARENT_BINARY"

      - name: Collect controller v7 six-pair A/A qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          aa_stdout="$RUNNER_TEMP/performance-rule/release-aa-v7.stdout.json"
          set +e
          python3 -B -m tools.performance_rule run \
            --parent "$PARENT_BINARY" \
            --pairs 6 \
            --output "$AA_REPORT" \
            -- --profile qualification --samples 101 --workspace-root . \
            >"$aa_stdout"
          controller_status=$?
          set -e
          printf '%s\n' "$controller_status" >"$CALIBRATION_EVIDENCE/controller-exit-code.txt"
          test "$controller_status" -eq 4
          cmp "$aa_stdout" "$AA_REPORT"
          rm -- "$aa_stdout"

      - name: Validate and bind calibration evidence identities
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.ci.performance_rule_workflow calibration-manifest \
            --evidence "$CALIBRATION_EVIDENCE" \
            --parent "$PARENT_BINARY" \
            --aa-report "$AA_REPORT" \
            --host-identity "$HOST_IDENTITY" \
            --workspace "$GITHUB_WORKSPACE" \
            --expected-sha "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$CALIBRATION_EVIDENCE/calibration-manifest.json"

      - name: Upload calibration evidence and exact parent
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-rule-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-rule/calibration
          if-no-files-found: warn
          retention-days: 90

  comparison:
    name: comparison
    needs: invocation
    if: ${{ inputs.stage == 'comparison' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CALIBRATION_RUN_ID: ${{ inputs.calibration_run_id }}
      REVIEWED_BY: ${{ inputs.reviewed_by }}
      REVIEWED_UTC: ${{ inputs.reviewed_utc }}
      FEATURE_KEY: ${{ inputs.candidate_feature }}
    steps:
      - name: Checkout exact comparison source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Validate comparison inputs and initialize paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git status --porcelain=v1 --untracked-files=normal)" = ""
          python3 -B -m tools.ci.performance_rule_workflow prepare-comparison \
            --root "$RUNNER_TEMP/performance-rule" \
            --github-env "$GITHUB_ENV" \
            --run-id "$CALIBRATION_RUN_ID" \
            --current-run-id "$GITHUB_RUN_ID" \
            --reviewed-by "$REVIEWED_BY" \
            --reviewed-utc "$REVIEWED_UTC" \
            --feature "$FEATURE_KEY"

      - name: Require exact AMD comparison host identity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.ci.performance_rule_workflow capture-host \
            --output "$COMPARISON_HOST_IDENTITY"

      - name: Resolve one successful calibration workflow attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B -m tools.ci.performance_rule_workflow resolve-calibration \
            --run-id "$CALIBRATION_RUN_ID" \
            --current-run-id "$GITHUB_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-sha "$CANDIDATE_SHA" \
            --api-url "$GITHUB_API_URL" \
            --github-env "$GITHUB_ENV"

      - name: Download exact calibration run artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.CALIBRATION_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/performance-rule/downloaded-calibration
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.calibration_run_id }}

      - name: Verify calibration run source host and artifact closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.ci.performance_rule_workflow verify-calibration \
            --artifact "$DOWNLOADED_CALIBRATION" \
            --comparison-host "$COMPARISON_HOST_IDENTITY" \
            --workspace "$GITHUB_WORKSPACE" \
            --expected-sha "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$CALIBRATION_RUN_ID" \
            --run-attempt "$CALIBRATION_RUN_ATTEMPT"
          install -m 0755 \
            "$DOWNLOADED_CALIBRATION/parent/ferrum2-rule-qualification" \
            "$CALIBRATED_PARENT"
          install -m 0644 \
            "$DOWNLOADED_CALIBRATION/release-aa-v7.json" \
            "$COMPARISON_EVIDENCE/release-aa-v7.json"
          install -m 0644 \
            "$DOWNLOADED_CALIBRATION/calibration-manifest.json" \
            "$COMPARISON_EVIDENCE/calibration-manifest.json"
          install -m 0644 \
            "$DOWNLOADED_CALIBRATION/host-identity.json" \
            "$COMPARISON_EVIDENCE/calibration-host-identity.json"
          test -x "$CALIBRATED_PARENT"

      - name: Create explicitly reviewed source-bound calibration
        shell: bash
        run: |
          set -euo pipefail
          reviewed_stdout="$RUNNER_TEMP/performance-rule/reviewed-aa-v3.stdout.json"
          python3 -B -m tools.performance_rule review-calibration \
            --source-report "$COMPARISON_EVIDENCE/release-aa-v7.json" \
            --reviewed-by "$REVIEWED_BY" \
            --reviewed-utc "$REVIEWED_UTC" \
            --output "$REVIEWED_CALIBRATION" \
            >"$reviewed_stdout"
          cmp "$reviewed_stdout" "$REVIEWED_CALIBRATION"
          rm -- "$reviewed_stdout"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc +1.97.1 -Vv

      - name: Build independent candidate feature binary
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_TARGET"
          cargo +1.97.1 build --release --locked \
            -p ferrum2-rule-qualification \
            --no-default-features \
            --features "$CANDIDATE_FEATURES" \
            --target-dir "$CANDIDATE_TARGET"
          install -m 0755 \
            "$CANDIDATE_TARGET/release/ferrum2-rule-qualification" \
            "$CANDIDATE_BINARY"
          test -x "$CANDIDATE_BINARY"
          test "$(sha256sum "$CALIBRATED_PARENT" | awk '{print $1}')" \
            != "$(sha256sum "$CANDIDATE_BINARY" | awk '{print $1}')"

      - name: Collect reviewed six-pair A/B qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          ab_stdout="$RUNNER_TEMP/performance-rule/release-ab-v7.stdout.json"
          set +e
          python3 -B -m tools.performance_rule run \
            --parent "$CALIBRATED_PARENT" \
            --candidate "$CANDIDATE_BINARY" \
            --calibration "$REVIEWED_CALIBRATION" \
            --pairs 6 \
            --output "$AB_REPORT" \
            -- --profile qualification --samples 101 --workspace-root . \
            >"$ab_stdout"
          controller_status=$?
          set -e
          printf '%s\n' "$controller_status" >"$COMPARISON_EVIDENCE/ab-exit-code.txt"
          if [ -f "$AB_REPORT" ]; then
            cmp "$ab_stdout" "$AB_REPORT"
          fi
          rm -f -- "$ab_stdout"

      - name: Collect candidate qualification including 100k
        shell: bash
        run: |
          set -euo pipefail
          qualification_stdout="$RUNNER_TEMP/performance-rule/candidate-qualification.stdout.json"
          set +e
          "$CANDIDATE_BINARY" \
            --profile qualification \
            --include-100k \
            --workspace-root . \
            --output "$QUALIFICATION_REPORT" \
            >"$qualification_stdout"
          qualification_status=$?
          set -e
          printf '%s\n' "$qualification_status" \
            >"$COMPARISON_EVIDENCE/qualification-exit-code.txt"
          if [ -f "$QUALIFICATION_REPORT" ]; then
            cmp "$qualification_stdout" "$QUALIFICATION_REPORT"
          fi
          rm -f -- "$qualification_stdout"

      - name: Validate comparison raw evidence and write hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.ci.performance_rule_workflow validate-comparison \
            --evidence "$COMPARISON_EVIDENCE" \
            --workspace "$GITHUB_WORKSPACE" \
            --parent "$CALIBRATED_PARENT" \
            --candidate "$CANDIDATE_BINARY" \
            --calibration "$REVIEWED_CALIBRATION" \
            --ab-report "$AB_REPORT" \
            --qualification-report "$QUALIFICATION_REPORT" \
            --reviewed-by "$REVIEWED_BY" \
            --reviewed-utc "$REVIEWED_UTC" \
            --feature "$FEATURE_KEY" \
            --repository "$GITHUB_REPOSITORY" \
            --expected-sha "$CANDIDATE_SHA" \
            --comparison-run-id "$GITHUB_RUN_ID" \
            --comparison-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --calibration-run-id "$CALIBRATION_RUN_ID" \
            --output "$COMPARISON_EVIDENCE/comparison-manifest.json"

      - name: Upload comparison raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-rule-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-rule/comparison
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce reviewed comparison decision after evidence upload
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "$COMPARISON_EVIDENCE/comparison-manifest.json"
          test "$(cat "$COMPARISON_EVIDENCE/ab-exit-code.txt")" = 0
          test "$(cat "$COMPARISON_EVIDENCE/qualification-exit-code.txt")" = 0
