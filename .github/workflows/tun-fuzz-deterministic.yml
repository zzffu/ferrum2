name: tun-fuzz-static

on:
  pull_request:
    paths:
      - ".github/workflows/tun-fuzz-deterministic.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ferrum2-tun/fuzz/**"
      - "crates/ferrum2-tun/src/packet.rs"
      - "crates/ferrum2-tun/src/reassembly.rs"
      - "crates/ferrum2-tun/src/udp.rs"
      - "crates/ferrum2-tun/src/wake.rs"
      - "crates/ferrum2-tun/tests/fixtures/packets/**"
      - "crates/ferrum2-config/Cargo.toml"
      - "crates/ferrum2-config/src/**"
      - "crates/ferrum2-core/Cargo.toml"
      - "crates/ferrum2-core/src/**"
      - "crates/ferrum2-crypto/Cargo.toml"
      - "crates/ferrum2-crypto/src/**"
      - "crates/ferrum2-dns/Cargo.toml"
      - "crates/ferrum2-dns/src/**"
      - "crates/ferrum2-rule/Cargo.toml"
      - "crates/ferrum2-rule/src/**"
      - "crates/ferrum2-runtime/Cargo.toml"
      - "crates/ferrum2-runtime/src/**"
      - "crates/ferrum2-wintun/Cargo.toml"
      - "crates/ferrum2-wintun/src/lib.rs"
      - "crates/ferrum2-wintun/src/strict_route.rs"
      - "crates/ferrum2-wintun/src/unsupported.rs"
      - "crates/ferrum2-wintun/src/windows.rs"
      - "tests/platform/run_windows_tun_hyperv.ps1"
      - "vendor/shadowsocks-crypto/**"
  push:
    branches:
      - master
      - "codex/integration/**"
    paths:
      - ".github/workflows/tun-fuzz-deterministic.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/ferrum2-tun/fuzz/**"
      - "crates/ferrum2-tun/src/packet.rs"
      - "crates/ferrum2-tun/src/reassembly.rs"
      - "crates/ferrum2-tun/src/udp.rs"
      - "crates/ferrum2-tun/src/wake.rs"
      - "crates/ferrum2-tun/tests/fixtures/packets/**"
      - "crates/ferrum2-config/Cargo.toml"
      - "crates/ferrum2-config/src/**"
      - "crates/ferrum2-core/Cargo.toml"
      - "crates/ferrum2-core/src/**"
      - "crates/ferrum2-crypto/Cargo.toml"
      - "crates/ferrum2-crypto/src/**"
      - "crates/ferrum2-dns/Cargo.toml"
      - "crates/ferrum2-dns/src/**"
      - "crates/ferrum2-rule/Cargo.toml"
      - "crates/ferrum2-rule/src/**"
      - "crates/ferrum2-runtime/Cargo.toml"
      - "crates/ferrum2-runtime/src/**"
      - "crates/ferrum2-wintun/Cargo.toml"
      - "crates/ferrum2-wintun/src/lib.rs"
      - "crates/ferrum2-wintun/src/strict_route.rs"
      - "crates/ferrum2-wintun/src/unsupported.rs"
      - "crates/ferrum2-wintun/src/windows.rs"
      - "tests/platform/run_windows_tun_hyperv.ps1"
      - "vendor/shadowsocks-crypto/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-build:
    name: deterministic-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned deterministic toolchain
        shell: bash
        run: rustup toolchain install nightly-2026-07-10 --profile minimal --component rustfmt
      - name: Fetch locked deterministic dependencies
        shell: bash
        working-directory: crates/ferrum2-tun/fuzz
        run: cargo +nightly-2026-07-10 fetch --locked
      - name: Compile no-default-features harnesses
        shell: bash
        working-directory: crates/ferrum2-tun/fuzz
        run: |
          set -euo pipefail
          cargo +nightly-2026-07-10 fmt --all -- --check
          cargo +nightly-2026-07-10 check --all-targets --no-default-features --locked --offline
          cargo +nightly-2026-07-10 test --no-default-features --no-run --locked --offline
          cargo +nightly-2026-07-10 build --bin smoke --no-default-features --locked --offline
      - name: Verify no generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain --untracked-files=no)" = ""

  libfuzzer-build:
    name: libfuzzer-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify clean current SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned fuzz toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly-2026-07-10 --profile minimal
          cargo +nightly-2026-07-10 install cargo-fuzz --version 0.13.2 --locked
          test "$(cargo +nightly-2026-07-10 fuzz --version)" = "cargo-fuzz 0.13.2"
      - name: Fetch locked fuzz dependencies
        shell: bash
        working-directory: crates/ferrum2-tun/fuzz
        run: cargo +nightly-2026-07-10 fetch --locked
      - name: Compile TUN fuzz targets without execution
        shell: bash
        working-directory: crates/ferrum2-tun/fuzz
        timeout-minutes: 10
        run: |
          set -euo pipefail
          CARGO_NET_OFFLINE=true cargo +nightly-2026-07-10 fuzz build --features libfuzzer packet_reassembly
          CARGO_NET_OFFLINE=true cargo +nightly-2026-07-10 fuzz build --features libfuzzer udp_reset_races
          CARGO_NET_OFFLINE=true cargo +nightly-2026-07-10 fuzz build --features libfuzzer config_legacy_fields
          CARGO_NET_OFFLINE=true cargo +nightly-2026-07-10 fuzz build --features libfuzzer strict_route_rules
      - name: Verify no generated diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git status --porcelain --untracked-files=no)" = ""
