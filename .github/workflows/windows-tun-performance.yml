name: windows-tun-performance

on:
  workflow_dispatch:
    inputs:
      run_kind:
        description: "A/A calibration artifact or calibrated parent/candidate comparison"
        required: true
        type: choice
        default: calibration-aa
        options:
          - calibration-aa
          - comparison
      parent_sha:
        description: "Exact parent SHA; must equal the candidate SHA for calibration-aa"
        required: true
        type: string
      evidence_directory:
        description: "Absolute approved-guest directory containing exactly 80 raw trial JSON files"
        required: true
        type: string
      identity_ledger:
        description: "Absolute path to the host-issued approved-guest identity ledger"
        required: true
        type: string

permissions:
  contents: read

jobs:
  paired-windows-tun-reducer:
    name: paired-windows-tun-${{ inputs.run_kind }}
    runs-on: [self-hosted, Windows, X64, ferrum2-hyperv-guest]
    timeout-minutes: 30
    env:
      RUN_KIND: ${{ inputs.run_kind }}
      REQUESTED_PARENT_SHA: ${{ inputs.parent_sha }}
      RAW_EVIDENCE_DIRECTORY: ${{ inputs.evidence_directory }}
      IDENTITY_LEDGER: ${{ inputs.identity_ledger }}
    steps:
      - name: Checkout exact candidate controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Bind the exact approved guest and evidence inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (git status --porcelain) { throw "dirty checkout" }
          $candidateSha = git rev-parse HEAD
          if ($candidateSha -cne $env:GITHUB_SHA) { throw "candidate SHA mismatch" }
          if ($env:REQUESTED_PARENT_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw "parent SHA must be lowercase 40-hex"
          }
          if ($env:RUN_KIND -eq "calibration-aa") {
            if ($env:REQUESTED_PARENT_SHA -cne $candidateSha) {
              throw "A/A requires parent and candidate to be the same SHA"
            }
          } elseif ($env:RUN_KIND -eq "comparison") {
            if ($env:REQUESTED_PARENT_SHA -ceq $candidateSha) {
              throw "comparison requires distinct parent and candidate SHAs"
            }
            python -B tools/performance_candidate.py validate-git `
              --repository $env:GITHUB_WORKSPACE `
              --parent-sha $env:REQUESTED_PARENT_SHA `
              --candidate-sha $candidateSha
            if ($LASTEXITCODE -ne 0) { throw "parent/candidate ancestry is invalid" }
          } else {
            throw "closed run_kind dispatch rejected"
          }
          if ($env:RUNNER_OS -cne "Windows" -or $env:RUNNER_ARCH -cne "X64") {
            throw "runner platform mismatch"
          }
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction Stop
          if ($computer.Manufacturer -cne "Microsoft Corporation" -or
              $computer.Model -cne "Virtual Machine") {
            throw "Windows TUN evidence reduction is restricted to the approved Hyper-V guest"
          }
          $ledgerPath = (Resolve-Path -LiteralPath $env:IDENTITY_LEDGER).Path
          if ((Get-Item -LiteralPath $ledgerPath -Force).Attributes -band
              [IO.FileAttributes]::ReparsePoint) {
            throw "identity ledger cannot be a reparse point"
          }
          $ledger = Get-Content -LiteralPath $ledgerPath -Raw -Encoding utf8 |
            ConvertFrom-Json -Depth 4
          if ($ledger.vm_name -cne "Windows 10 MSIX packaging environment" -or
              $ledger.vm_id -cne "82e20295-1d30-48e7-a751-e21d35d872d4" -or
              $ledger.checkpoint_name -cne "Ferrum2-TCP08-min-runtime-20260817T172815Z-581D60045FB9" -or
              $ledger.checkpoint_id -cne "1e570209-faf7-4248-8167-aa0687cdb8cf") {
            throw "identity ledger does not bind the approved guest/checkpoint"
          }
          $evidence = (Resolve-Path -LiteralPath $env:RAW_EVIDENCE_DIRECTORY).Path
          if (-not [IO.Path]::IsPathFullyQualified($evidence) -or
              -not (Test-Path -LiteralPath $evidence -PathType Container)) {
            throw "evidence directory must be an existing absolute directory"
          }
          if ((Get-Item -LiteralPath $evidence -Force).Attributes -band
              [IO.FileAttributes]::ReparsePoint) {
            throw "evidence directory cannot be a reparse point"
          }
          $outputDirectory = Join-Path $env:RUNNER_TEMP (
            "windows-tun-performance-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          if (Test-Path -LiteralPath $outputDirectory) {
            throw "output directory baseline is not absent"
          }
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null
          @(
            "CANDIDATE_SHA=$candidateSha"
            "EVIDENCE_DIRECTORY=$evidence"
            "PERFORMANCE_OUTPUT_DIRECTORY=$outputDirectory"
            "PERFORMANCE_PLAN=$(Join-Path $outputDirectory 'plan.json')"
            "PERFORMANCE_SUMMARY=$(Join-Path $outputDirectory 'summary.json')"
            "PERFORMANCE_MARKDOWN=$(Join-Path $outputDirectory 'summary.md')"
            "CALIBRATION_ARTIFACT=$(Join-Path $outputDirectory 'aa-calibration.json')"
            "PERFORMANCE_POLICY=$env:GITHUB_WORKSPACE\tools\windows_tun_performance_policy.json"
          ) | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Materialize the fixed eight-scenario recipe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -B tools/performance_candidate.py windows-tun-plan `
            --run-kind $env:RUN_KIND `
            --policy $env:PERFORMANCE_POLICY `
            --output $env:PERFORMANCE_PLAN
          if ($LASTEXITCODE -ne 0) { throw "Windows TUN plan failed" }
          $trials = @(
            python -B tools/performance_candidate.py windows-tun-trials `
              --plan $env:PERFORMANCE_PLAN `
              --policy $env:PERFORMANCE_POLICY
          )
          if ($LASTEXITCODE -ne 0 -or $trials.Count -ne 80) {
            throw "fixed Windows TUN trial schedule is incomplete"
          }
          $trials | Set-Content `
            -LiteralPath (Join-Path $env:PERFORMANCE_OUTPUT_DIRECTORY "trial-schedule.tsv") `
            -Encoding utf8

      - name: Reduce paired evidence and create A/A artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $arguments = @(
            "-B", "tools/performance_candidate.py", "windows-tun-summarize",
            "--plan", $env:PERFORMANCE_PLAN,
            "--evidence-root", $env:EVIDENCE_DIRECTORY,
            "--parent-sha", $env:REQUESTED_PARENT_SHA,
            "--candidate-sha", $env:CANDIDATE_SHA,
            "--policy", $env:PERFORMANCE_POLICY,
            "--output", $env:PERFORMANCE_SUMMARY,
            "--markdown", $env:PERFORMANCE_MARKDOWN
          )
          if ($env:RUN_KIND -eq "calibration-aa") {
            $arguments += @("--calibration-output", $env:CALIBRATION_ARTIFACT)
          }
          & python @arguments
          $summaryExit = $LASTEXITCODE
          if (Test-Path -LiteralPath $env:PERFORMANCE_MARKDOWN -PathType Leaf) {
            Get-Content -LiteralPath $env:PERFORMANCE_MARKDOWN -Raw -Encoding utf8 |
              Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          }
          exit $summaryExit

      - name: Stage only raw files bound by the validated evidence manifest
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:PERFORMANCE_SUMMARY -PathType Leaf)) {
            Write-Output "No summary exists; raw evidence was not validated."
            exit 0
          }
          $summary = Get-Content -LiteralPath $env:PERFORMANCE_SUMMARY -Raw -Encoding utf8 |
            ConvertFrom-Json -Depth 12
          if ($summary.correctness_complete -ne $true -or $summary.evidence_files.Count -ne 80) {
            Write-Output "Summary did not validate a complete raw evidence set."
            exit 0
          }
          $rawOutput = Join-Path $env:PERFORMANCE_OUTPUT_DIRECTORY "raw-evidence"
          if (Test-Path -LiteralPath $rawOutput) { throw "raw staging baseline is not absent" }
          New-Item -ItemType Directory -Path $rawOutput | Out-Null
          foreach ($entry in $summary.evidence_files) {
            if ([IO.Path]::GetFileName([string]$entry.file) -cne [string]$entry.file) {
              throw "evidence manifest contains a non-leaf name"
            }
            $source = Join-Path $env:EVIDENCE_DIRECTORY ([string]$entry.file)
            $item = Get-Item -LiteralPath $source -Force -ErrorAction Stop
            if (-not $item.PSIsContainer -and
                -not ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -and
                (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -ceq
                  [string]$entry.sha256) {
              Copy-Item -LiteralPath $source -Destination $rawOutput -ErrorAction Stop
            } else {
              throw "raw evidence no longer matches its validated manifest"
            }
          }
          if (@(Get-ChildItem -LiteralPath $rawOutput -File).Count -ne 80) {
            throw "raw evidence staging is incomplete"
          }

      - name: Upload plan, validated raw evidence, summary, and calibration observation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-tun-paired-${{ inputs.run_kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PERFORMANCE_OUTPUT_DIRECTORY }}
            ${{ github.workspace }}\tools\windows_tun_performance_policy.json
          if-no-files-found: error
          retention-days: 30
