name: performance-candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Single-scenario diagnostic or guarded qualification"
        required: true
        type: choice
        default: qualification
        options:
          - qualification
          - diagnostic
      parent_sha:
        description: "Exact ancestor commit SHA"
        required: true
        type: string
      scenario:
        description: "Primary or diagnostic workload"
        required: true
        type: choice
        default: tcp-stream-64k
        options:
          - tcp-bulk
          - tcp-stream-64k
          - tcp-request-1k
          - tcp-request-4k
          - tcp-request-16k
          - udp-small-high
          - udp-mtu-1200
      warmup_seconds:
        description: "Warmup seconds"
        required: true
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      active_seconds:
        description: "Measured seconds"
        required: true
        type: choice
        default: "30"
        options: ["15", "30", "60"]
      pairs:
        description: "Alternating parent/candidate pairs"
        required: true
        type: choice
        default: "3"
        options: ["3", "5"]

permissions:
  contents: read

jobs:
  paired-profile:
    name: paired-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PARENT_SHA: ${{ inputs.parent_sha }}
      MODE: ${{ inputs.mode }}
      SELECTED_SCENARIO: ${{ inputs.scenario }}
      WARMUP_SECONDS: ${{ inputs.warmup_seconds }}
      ACTIVE_SECONDS: ${{ inputs.active_seconds }}
      PAIRS: ${{ inputs.pairs }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Bind exact parent and runner identity
        shell: bash
        run: |
          set -euo pipefail
          PARENT_DIR="$RUNNER_TEMP/ferrum2-parent"
          PERFORMANCE_PLAN="$RUNNER_TEMP/performance-plan.json"
          PERFORMANCE_SUMMARY="$RUNNER_TEMP/performance-summary.json"
          PERFORMANCE_MARKDOWN="$RUNNER_TEMP/performance-summary.md"
          {
            printf 'PARENT_DIR=%s\n' "$PARENT_DIR"
            printf 'PERFORMANCE_PLAN=%s\n' "$PERFORMANCE_PLAN"
            printf 'PERFORMANCE_SUMMARY=%s\n' "$PERFORMANCE_SUMMARY"
            printf 'PERFORMANCE_MARKDOWN=%s\n' "$PERFORMANCE_MARKDOWN"
          } >>"$GITHUB_ENV"
          [[ "$PARENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          PARENT_SHA="${PARENT_SHA,,}"
          printf 'PARENT_SHA=%s\n' "$PARENT_SHA" >>"$GITHUB_ENV"
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -B tools/performance_candidate.py validate-git \
            --repository "$GITHUB_WORKSPACE" \
            --parent-sha "$PARENT_SHA" \
            --candidate-sha "$GITHUB_SHA"
          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          python3 -B tools/performance_candidate.py plan \
            --mode "$MODE" \
            --scenario "$SELECTED_SCENARIO" \
            --warmup-seconds "$WARMUP_SECONDS" \
            --active-seconds "$ACTIVE_SECONDS" \
            --pairs "$PAIRS" \
            --output "$PERFORMANCE_PLAN"
          for process in ferrum2-client ferrum2-server; do
            ! pgrep -x "$process" >/dev/null
          done
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 -Vv
          test ! -e "$PARENT_DIR"
          git worktree add --detach "$PARENT_DIR" "$PARENT_SHA"
          exclude="$(git rev-parse --git-path info/exclude)"
          printf '/profiles/\n' >>"$exclude"
      - name: Prove parent and candidate correctness and build identities
        shell: bash
        run: |
          set -euo pipefail
          for repository in "$PARENT_DIR" "$GITHUB_WORKSPACE"; do
            (
              cd "$repository"
              test "$(git status --porcelain)" = ""
              cargo +1.97.1 test --workspace --locked
              cargo +1.97.1 build --profile profiling \
                -p ferrum2-client -p ferrum2-server -p ferrum2-m4-qualification --bins --locked
              target/profiling/m4-qualification self-check
            )
          done
      - name: Run alternating parent and candidate pairs
        shell: bash
        run: |
          set -euo pipefail
          run_member() {
            scenario=$1
            member=$2
            pair=$3
            order=$4
            if [ "$member" = parent ]; then
              repository=$PARENT_DIR
            else
              repository=$GITHUB_WORKSPACE
            fi
            (
              cd "$repository"
              target/profiling/m4-qualification profile-workload \
                --scenario "$scenario" \
                --warmup-seconds "$WARMUP_SECONDS" \
                --active-seconds "$ACTIVE_SECONDS" \
                --ready-file "profiles/paired/$scenario-$member-$pair.ready" \
                --output "profiles/paired/$scenario-$member-$pair.jsonl" \
                --parent-sha "$PARENT_SHA" \
                --candidate-sha "$GITHUB_SHA" \
                --member "$member" \
                --pair "$pair" \
                --order "$order" \
                --build-profile current
            )
          }
          mapfile -t scenarios < <(
            python3 -B tools/performance_candidate.py scenarios --plan "$PERFORMANCE_PLAN"
          )
          test "${#scenarios[@]}" -gt 0
          for scenario in "${scenarios[@]}"; do
            for pair in $(seq 1 "$PAIRS"); do
              if ((pair % 2 == 1)); then
                run_member "$scenario" parent "$pair" 1
                run_member "$scenario" candidate "$pair" 2
              else
                run_member "$scenario" candidate "$pair" 1
                run_member "$scenario" parent "$pair" 2
              fi
            done
          done
      - name: Summarize paired performance evidence
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          summary_status=0
          python3 -B tools/performance_candidate.py summarize \
            --plan "$PERFORMANCE_PLAN" \
            --parent-root "$PARENT_DIR/profiles/paired" \
            --candidate-root "$GITHUB_WORKSPACE/profiles/paired" \
            --parent-sha "$PARENT_SHA" \
            --candidate-sha "$GITHUB_SHA" \
            --output "$PERFORMANCE_SUMMARY" \
            --markdown "$PERFORMANCE_MARKDOWN" || summary_status=$?
          if [ -f "$PERFORMANCE_MARKDOWN" ]; then
            if ! cat "$PERFORMANCE_MARKDOWN" >>"$GITHUB_STEP_SUMMARY"; then
              if [ "$summary_status" -eq 0 ]; then
                summary_status=1
              fi
            fi
          else
            if [ "$summary_status" -eq 0 ]; then
              summary_status=1
            fi
          fi
          exit "$summary_status"
      - name: Upload paired raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-profile-${{ inputs.mode }}-${{ inputs.scenario }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/profiles/paired/*.jsonl
            ${{ runner.temp }}/ferrum2-parent/profiles/paired/*.jsonl
            ${{ runner.temp }}/performance-plan.json
            ${{ runner.temp }}/performance-summary.json
            ${{ runner.temp }}/performance-summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Reap processes and remove parent worktree
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          for signal in TERM KILL; do
            for process in ferrum2-client ferrum2-server; do
              pkill "-$signal" -x "$process" 2>/dev/null || status=$?
              if [ "${status:-0}" -gt 1 ]; then cleanup_status=1; fi
              status=0
            done
            sleep 1
          done
          for process in ferrum2-client ferrum2-server; do
            if pgrep -x "$process" >/dev/null; then cleanup_status=1; fi
          done
          if [ -n "${PARENT_DIR:-}" ] && [ -e "$PARENT_DIR" ]; then
            git worktree remove --force "$PARENT_DIR" || cleanup_status=1
          fi
          test "$cleanup_status" -eq 0
