name: performance-candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Single-scenario diagnostic or guarded qualification"
        required: true
        type: choice
        default: qualification
        options:
          - qualification
          - diagnostic
      parent_sha:
        description: "Exact ancestor SHA, or exact H/final SHA for tcp-scale-10k"
        required: true
        type: string
      selection:
        description: "Linux paired workload or group; Windows TUN runs only in local Hyper-V"
        required: true
        type: choice
        default: tcp-stream-64k
        options:
          - tcp-bulk
          - tcp-stream-64k
          - tcp-request-1k
          - tcp-request-4k
          - tcp-request-16k
          - udp-small-high
          - udp-mtu-1200
          - udp-payload-1472
          - udp-payload-1500
          - udp-payload-8192
          - udp-max-wire-65507
          - udp-direct-small-128
          - udp-direct-max-65497
          - udp-payload-matrix
          - udp-direct-payload-bounds
          - tcp-frame-capacity
          - tcp-scale-10k
      warmup_seconds:
        description: "Warmup seconds"
        required: true
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      active_seconds:
        description: "Measured seconds"
        required: true
        type: choice
        default: "30"
        options: ["15", "30", "60"]
      pairs:
        description: "Alternating parent/candidate pairs"
        required: true
        type: choice
        default: "3"
        options: ["3", "5"]

permissions:
  contents: read

jobs:
  paired-profile:
    name: paired-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REQUESTED_PARENT_SHA: ${{ inputs.parent_sha }}
      MODE: ${{ inputs.mode }}
      SELECTION: ${{ inputs.selection }}
      WARMUP_SECONDS: ${{ inputs.warmup_seconds }}
      ACTIVE_SECONDS: ${{ inputs.active_seconds }}
      PAIRS: ${{ inputs.pairs }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Bind exact parent and runner identity
        shell: bash
        run: |
          set -euo pipefail
          PARENT_DIR="$RUNNER_TEMP/ferrum2-parent"
          CANDIDATE_DIR="$GITHUB_WORKSPACE"
          PERFORMANCE_PLAN="$RUNNER_TEMP/performance-plan.json"
          PERFORMANCE_SUMMARY="$RUNNER_TEMP/performance-summary.json"
          PERFORMANCE_MARKDOWN="$RUNNER_TEMP/performance-summary.md"
          PERFORMANCE_POLICY="$GITHUB_WORKSPACE/tools/performance_candidate_policy.json"
          PERFORMANCE_SCALE_POLICY="$GITHUB_WORKSPACE/tools/performance_candidate_scale_safety_policy.json"
          SCALE_LINEAGE="$RUNNER_TEMP/performance-scale-lineage.json"
          {
            printf 'PARENT_DIR=%s\n' "$PARENT_DIR"
            printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR"
            printf 'PERFORMANCE_PLAN=%s\n' "$PERFORMANCE_PLAN"
            printf 'PERFORMANCE_SUMMARY=%s\n' "$PERFORMANCE_SUMMARY"
            printf 'PERFORMANCE_MARKDOWN=%s\n' "$PERFORMANCE_MARKDOWN"
            printf 'PERFORMANCE_POLICY=%s\n' "$PERFORMANCE_POLICY"
            printf 'PERFORMANCE_SCALE_POLICY=%s\n' "$PERFORMANCE_SCALE_POLICY"
            printf 'SCALE_LINEAGE=%s\n' "$SCALE_LINEAGE"
          } >>"$GITHUB_ENV"
          [[ "$REQUESTED_PARENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          REQUESTED_PARENT_SHA="${REQUESTED_PARENT_SHA,,}"
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          for process in ferrum2-client ferrum2-server; do
            ! pgrep -x "$process" >/dev/null
          done
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 -Vv
          test ! -e "$PARENT_DIR"
          if [ "$SELECTION" = tcp-scale-10k ]; then
            test "$MODE/$WARMUP_SECONDS/$ACTIVE_SECONDS/$PAIRS" = "qualification/10/30/5"
            H_SHA="$REQUESTED_PARENT_SHA"
            test "$(git rev-parse "$H_SHA^{commit}")" = "$H_SHA"
            CANDIDATE_SHA="$(git rev-parse HEAD)"
            PARENT_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
            test "$(git rev-parse "$PARENT_SHA^")" = "$H_SHA"
            test "$(git rev-list --parents -n 1 "$PARENT_SHA" | wc -w)" -eq 2
            test "$(git rev-list --parents -n 1 "$CANDIDATE_SHA" | wc -w)" -eq 2
            test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = \
              "$(git rev-parse "$H_SHA^{tree}")"
            python3 -B tools/performance_candidate.py scale-source-lineage \
              --repository "$GITHUB_WORKSPACE" \
              --head-sha "$H_SHA" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA"
            git worktree add --detach "$PARENT_DIR" "$PARENT_SHA"
          else
            H_SHA="$GITHUB_SHA"
            PARENT_SHA="$REQUESTED_PARENT_SHA"
            CANDIDATE_SHA="$GITHUB_SHA"
            python3 -B tools/performance_candidate.py validate-git \
              --repository "$GITHUB_WORKSPACE" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA"
            git worktree add --detach "$PARENT_DIR" "$PARENT_SHA"
          fi
          {
            printf 'H_SHA=%s\n' "$H_SHA"
            printf 'PARENT_SHA=%s\n' "$PARENT_SHA"
            printf 'CANDIDATE_SHA=%s\n' "$CANDIDATE_SHA"
            printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR"
          } >>"$GITHUB_ENV"
          exclude="$(git rev-parse --git-path info/exclude)"
          printf '/profiles/\n' >>"$exclude"
      - name: Prove parent and candidate correctness and build identities
        shell: bash
        run: |
          set -euo pipefail
          for repository in "$PARENT_DIR" "$CANDIDATE_DIR"; do
            (
              cd "$repository"
              test "$(git status --porcelain)" = ""
              cargo +1.97.1 build \
                -p ferrum2-client -p ferrum2-server --bins --locked
              cargo +1.97.1 test --workspace \
                --exclude ferrum2-client \
                --exclude ferrum2-tun \
                --exclude ferrum2-wintun \
                --exclude ferrum2-m0-harness \
                --locked
              cargo +1.97.1 test \
                -p ferrum2-client \
                -p ferrum2-tun \
                -p ferrum2-wintun \
                --all-features --no-run --locked
              cargo +1.97.1 test \
                -p ferrum2-m0-harness --no-run --locked
              cargo +1.97.1 build --profile profiling \
                -p ferrum2-client -p ferrum2-server --bins --locked
            )
          done
          (
            cd "$CANDIDATE_DIR"
            cargo +1.97.1 build --profile profiling \
              -p ferrum2-m4-qualification --bins --locked
            target/profiling/m4-qualification self-check
          )
          plan_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            python3 -B tools/performance_candidate.py scale-lineage \
              --repository "$GITHUB_WORKSPACE" \
              --head-sha "$H_SHA" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA" \
              --runner "$CANDIDATE_DIR/target/profiling/m4-qualification" \
              --parent-client "$PARENT_DIR/target/profiling/ferrum2-client" \
              --parent-server "$PARENT_DIR/target/profiling/ferrum2-server" \
              --candidate-client "$CANDIDATE_DIR/target/profiling/ferrum2-client" \
              --candidate-server "$CANDIDATE_DIR/target/profiling/ferrum2-server" \
              --output "$SCALE_LINEAGE"
            plan_scale_arguments=(
              --scale-policy "$PERFORMANCE_SCALE_POLICY"
              --scale-lineage "$SCALE_LINEAGE"
            )
          fi
          python3 -B tools/performance_candidate.py plan \
            --mode "$MODE" \
            --selection "$SELECTION" \
            --warmup-seconds "$WARMUP_SECONDS" \
            --active-seconds "$ACTIVE_SECONDS" \
            --pairs "$PAIRS" \
            --policy "$PERFORMANCE_POLICY" \
            "${plan_scale_arguments[@]}" \
            --output "$PERFORMANCE_PLAN"
      - name: Run alternating parent and candidate pairs
        shell: bash
        run: |
          set -euo pipefail
          run_member() {
            scenario=$1
            member=$2
            pair=$3
            order=$4
            if [ "$member" = parent ]; then
              repository=$PARENT_DIR
            else
              repository=$CANDIDATE_DIR
            fi
            (
              cd "$repository"
              # Use one candidate-built harness for both members so new scenario
              # definitions are identical; the explicit paths still bind and hash
              # each member's exact checkout and client/server binaries.
              "$CANDIDATE_DIR/target/profiling/m4-qualification" profile-workload \
                --scenario "$scenario" \
                --warmup-seconds "$WARMUP_SECONDS" \
                --active-seconds "$ACTIVE_SECONDS" \
                --repository-root "$repository" \
                --binary-dir "$repository/target/profiling" \
                --ready-file "profiles/paired/$scenario-$member-$pair.ready" \
                --output "profiles/paired/$scenario-$member-$pair.jsonl" \
                --parent-sha "$PARENT_SHA" \
                --candidate-sha "$CANDIDATE_SHA" \
                --member "$member" \
                --pair "$pair" \
                --order "$order" \
                --build-profile current
            )
          }
          scenario_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            scenario_scale_arguments=(--scale-policy "$PERFORMANCE_SCALE_POLICY")
          fi
          mapfile -t scenarios < <(
            python3 -B tools/performance_candidate.py scenarios \
              --plan "$PERFORMANCE_PLAN" \
              --policy "$PERFORMANCE_POLICY" \
              "${scenario_scale_arguments[@]}"
          )
          test "${#scenarios[@]}" -gt 0
          for scenario in "${scenarios[@]}"; do
            for pair in $(seq 1 "$PAIRS"); do
              if ((pair % 2 == 1)); then
                run_member "$scenario" parent "$pair" 1
                run_member "$scenario" candidate "$pair" 2
              else
                run_member "$scenario" candidate "$pair" 1
                run_member "$scenario" parent "$pair" 2
              fi
            done
          done
      - name: Summarize paired performance evidence
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          summary_status=0
          summary_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            summary_scale_arguments=(
              --scale-policy "$PERFORMANCE_SCALE_POLICY"
              --repository "$GITHUB_WORKSPACE"
            )
          fi
          python3 -B tools/performance_candidate.py summarize \
            --plan "$PERFORMANCE_PLAN" \
            --parent-root "$PARENT_DIR/profiles/paired" \
            --candidate-root "$CANDIDATE_DIR/profiles/paired" \
            --parent-sha "$PARENT_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --policy "$PERFORMANCE_POLICY" \
            "${summary_scale_arguments[@]}" \
            --output "$PERFORMANCE_SUMMARY" \
            --markdown "$PERFORMANCE_MARKDOWN" || summary_status=$?
          if [ -f "$PERFORMANCE_MARKDOWN" ]; then
            if ! cat "$PERFORMANCE_MARKDOWN" >>"$GITHUB_STEP_SUMMARY"; then
              if [ "$summary_status" -eq 0 ]; then
                summary_status=1
              fi
            fi
          else
            if [ "$summary_status" -eq 0 ]; then
              summary_status=1
            fi
          fi
          exit "$summary_status"
      - name: Upload paired raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-profile-${{ inputs.mode }}-${{ inputs.selection }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/profiles/paired/*.jsonl
            ${{ runner.temp }}/ferrum2-parent/profiles/paired/*.jsonl
            ${{ runner.temp }}/performance-plan.json
            ${{ runner.temp }}/performance-summary.json
            ${{ runner.temp }}/performance-summary.md
            ${{ runner.temp }}/performance-scale-lineage.json
            ${{ github.workspace }}/tools/performance_candidate_policy.json
            ${{ github.workspace }}/tools/performance_candidate_scale_safety_policy.json
          if-no-files-found: error
          retention-days: 30
      - name: Reap processes and remove parent worktree
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          for signal in TERM KILL; do
            for process in ferrum2-client ferrum2-server; do
              pkill "-$signal" -x "$process" 2>/dev/null || status=$?
              if [ "${status:-0}" -gt 1 ]; then cleanup_status=1; fi
              status=0
            done
            sleep 1
          done
          for process in ferrum2-client ferrum2-server; do
            if pgrep -x "$process" >/dev/null; then cleanup_status=1; fi
          done
          for worktree in "${PARENT_DIR:-}" "${CANDIDATE_DIR:-}"; do
            if [ -n "$worktree" ] \
              && [ "$worktree" != "$GITHUB_WORKSPACE" ] \
              && [ -e "$worktree" ]; then
              git worktree remove --force "$worktree" || cleanup_status=1
            fi
          done
          test "$cleanup_status" -eq 0
