name: performance-candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Self-calibrated qualification, static qualification, or diagnostic"
        required: true
        type: choice
        default: calibrated-qualification
        options:
          - calibrated-qualification
          - qualification
          - diagnostic
      parent_sha:
        description: "Exact ancestor SHA, or exact H/final SHA for tcp-scale-10k"
        required: true
        type: string
      candidate_sha:
        description: "Exact product candidate SHA; workflow ref supplies controller code"
        required: true
        type: string
      selection:
        description: "Linux paired workload, group, or complete non-TUN matrix"
        required: true
        type: choice
        default: full-non-tun
        options:
          - full-non-tun
          - tcp-bulk
          - tcp-stream-64k
          - tcp-request-1k
          - tcp-request-4k
          - tcp-request-16k
          - dns-udp-concurrency
          - udp-small-high
          - udp-mtu-1200
          - udp-payload-1472
          - udp-payload-1500
          - udp-payload-8192
          - udp-max-wire-65507
          - udp-direct-small-128
          - udp-direct-max-65497
          - udp-payload-matrix
          - udp-direct-payload-bounds
          - tcp-frame-capacity
          - tcp-scale-10k
      warmup_seconds:
        description: "Warmup seconds"
        required: true
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      active_seconds:
        description: "Measured seconds"
        required: true
        type: choice
        default: "30"
        options: ["15", "30", "60"]
      pairs:
        description: "Pre-registered six-pair ABBA schedule"
        required: true
        type: choice
        default: "6"
        options: ["6"]

permissions:
  contents: read

jobs:
  paired-profile:
    name: paired-profile (${{ matrix.selection }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        selection: ${{ fromJSON(inputs.selection == 'full-non-tun' && '["tcp-frame-capacity","udp-payload-matrix","udp-direct-payload-bounds","dns-udp-concurrency"]' || format('["{0}"]', inputs.selection)) }}
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
      REQUESTED_PARENT_SHA: ${{ inputs.parent_sha }}
      REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      REQUESTED_MODE: ${{ inputs.mode }}
      PLAN_MODE: ${{ inputs.mode == 'calibrated-qualification' && 'qualification' || inputs.mode }}
      SELF_CALIBRATED: ${{ inputs.mode == 'calibrated-qualification' && 'true' || 'false' }}
      SELECTION: ${{ matrix.selection }}
      WARMUP_SECONDS: ${{ inputs.warmup_seconds }}
      ACTIVE_SECONDS: ${{ inputs.active_seconds }}
      PAIRS: ${{ inputs.pairs }}
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Bind controller and exact product identities
        shell: bash
        run: |
          set -euo pipefail
          CONTROLLER_DIR="$GITHUB_WORKSPACE"
          PARENT_DIR="$RUNNER_TEMP/ferrum2-parent"
          CANDIDATE_DIR="$RUNNER_TEMP/ferrum2-candidate"
          ARTIFACT_DIR="$RUNNER_TEMP/performance-artifact/$SELECTION"
          PERFORMANCE_PLAN="$ARTIFACT_DIR/performance-plan.json"
          PERFORMANCE_SUMMARY="$ARTIFACT_DIR/calibrated-summary.json"
          PERFORMANCE_MARKDOWN="$ARTIFACT_DIR/performance-summary.md"
          BASE_POLICY="$CONTROLLER_DIR/tools/performance_candidate_policy.json"
          RUNTIME_POLICY="$ARTIFACT_DIR/run-scoped-policy.json"
          CALIBRATION_REPORT="$ARTIFACT_DIR/calibration-report.json"
          PERFORMANCE_SCALE_POLICY="$CONTROLLER_DIR/tools/performance_candidate_scale_safety_policy.json"
          SCALE_LINEAGE="$ARTIFACT_DIR/performance-scale-lineage.json"
          PROFILE_RUNNER="$CONTROLLER_DIR/target/profiling/m4-qualification"
          mkdir -p "$ARTIFACT_DIR"
          cp "$BASE_POLICY" "$ARTIFACT_DIR/base-policy.json"
          {
            printf 'CONTROLLER_DIR=%s\n' "$CONTROLLER_DIR"
            printf 'PARENT_DIR=%s\n' "$PARENT_DIR"
            printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR"
            printf 'ARTIFACT_DIR=%s\n' "$ARTIFACT_DIR"
            printf 'PERFORMANCE_PLAN=%s\n' "$PERFORMANCE_PLAN"
            printf 'PERFORMANCE_SUMMARY=%s\n' "$PERFORMANCE_SUMMARY"
            printf 'PERFORMANCE_MARKDOWN=%s\n' "$PERFORMANCE_MARKDOWN"
            printf 'BASE_POLICY=%s\n' "$BASE_POLICY"
            printf 'ACTIVE_POLICY=%s\n' "$BASE_POLICY"
            printf 'RUNTIME_POLICY=%s\n' "$RUNTIME_POLICY"
            printf 'CALIBRATION_REPORT=%s\n' "$CALIBRATION_REPORT"
            printf 'PERFORMANCE_SCALE_POLICY=%s\n' "$PERFORMANCE_SCALE_POLICY"
            printf 'SCALE_LINEAGE=%s\n' "$SCALE_LINEAGE"
            printf 'PROFILE_RUNNER=%s\n' "$PROFILE_RUNNER"
          } >>"$GITHUB_ENV"
          [[ "$REQUESTED_PARENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$REQUESTED_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          REQUESTED_PARENT_SHA="${REQUESTED_PARENT_SHA,,}"
          REQUESTED_CANDIDATE_SHA="${REQUESTED_CANDIDATE_SHA,,}"
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          if [ "${{ inputs.selection }}" = full-non-tun ]; then
            test "$REQUESTED_MODE" = calibrated-qualification
          fi
          if [ "$SELF_CALIBRATED" = true ]; then
            test "$SELECTION" != tcp-scale-10k
            test "$PLAN_MODE/$WARMUP_SECONDS/$ACTIVE_SECONDS/$PAIRS" = \
              "qualification/3/30/6"
          fi
          for process in ferrum2-client ferrum2-server; do
            ! pgrep -x "$process" >/dev/null
          done
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 -Vv
          test ! -e "$PARENT_DIR"
          test ! -e "$CANDIDATE_DIR"
          CANDIDATE_SHA="$(git rev-parse "$REQUESTED_CANDIDATE_SHA^{commit}")"
          test "$CANDIDATE_SHA" = "$REQUESTED_CANDIDATE_SHA"
          if [ "$SELECTION" = tcp-scale-10k ]; then
            test "$REQUESTED_MODE/$WARMUP_SECONDS/$ACTIVE_SECONDS/$PAIRS" = \
              "qualification/10/30/6"
            H_SHA="$REQUESTED_PARENT_SHA"
            test "$(git rev-parse "$H_SHA^{commit}")" = "$H_SHA"
            PARENT_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
            test "$(git rev-parse "$PARENT_SHA^")" = "$H_SHA"
            test "$(git rev-list --parents -n 1 "$PARENT_SHA" | wc -w)" -eq 2
            test "$(git rev-list --parents -n 1 "$CANDIDATE_SHA" | wc -w)" -eq 2
            test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = \
              "$(git rev-parse "$H_SHA^{tree}")"
            python3 -B -m tools.performance_candidate scale-source-lineage \
              --repository "$CONTROLLER_DIR" \
              --head-sha "$H_SHA" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA"
          else
            H_SHA="$GITHUB_SHA"
            PARENT_SHA="$REQUESTED_PARENT_SHA"
            python3 -B -m tools.performance_candidate validate-git \
              --repository "$CONTROLLER_DIR" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA"
          fi
          git worktree add --detach "$PARENT_DIR" "$PARENT_SHA"
          git worktree add --detach "$CANDIDATE_DIR" "$CANDIDATE_SHA"
          {
            printf 'H_SHA=%s\n' "$H_SHA"
            printf 'PARENT_SHA=%s\n' "$PARENT_SHA"
            printf 'CANDIDATE_SHA=%s\n' "$CANDIDATE_SHA"
          } >>"$GITHUB_ENV"
          exclude="$(git rev-parse --git-path info/exclude)"
          printf '/profiles/\n' >>"$exclude"
      - name: Prove product correctness and build exact binaries
        shell: bash
        run: |
          set -euo pipefail
          for repository in "$PARENT_DIR" "$CANDIDATE_DIR"; do
            (
              cd "$repository"
              test "$(git status --porcelain)" = ""
              cargo +1.97.1 build \
                -p ferrum2-client -p ferrum2-server --bins --locked
              cargo +1.97.1 test --workspace \
                --exclude ferrum2-client \
                --exclude ferrum2-tun \
                --exclude ferrum2-platform-windows \
                --exclude ferrum2-m0-harness \
                --locked
              cargo +1.97.1 test \
                -p ferrum2-client \
                -p ferrum2-tun \
                -p ferrum2-platform-windows \
                --all-features --no-run --locked
              cargo +1.97.1 test \
                -p ferrum2-m0-harness --no-run --locked
              cargo +1.97.1 build --profile profiling \
                -p ferrum2-client -p ferrum2-server --bins --locked
            )
          done
          (
            cd "$CONTROLLER_DIR"
            cargo +1.97.1 build --profile profiling \
              -p ferrum2-m4-qualification --bins --locked
            "$PROFILE_RUNNER" self-check
          )
          plan_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            python3 -B -m tools.performance_candidate scale-lineage \
              --repository "$CONTROLLER_DIR" \
              --head-sha "$H_SHA" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA" \
              --runner "$PROFILE_RUNNER" \
              --parent-client "$PARENT_DIR/target/profiling/ferrum2-client" \
              --parent-server "$PARENT_DIR/target/profiling/ferrum2-server" \
              --candidate-client "$CANDIDATE_DIR/target/profiling/ferrum2-client" \
              --candidate-server "$CANDIDATE_DIR/target/profiling/ferrum2-server" \
              --output "$SCALE_LINEAGE"
            plan_scale_arguments=(
              --scale-policy "$PERFORMANCE_SCALE_POLICY"
              --scale-lineage "$SCALE_LINEAGE"
            )
          fi
          python3 -B -m tools.performance_candidate plan \
            --mode "$PLAN_MODE" \
            --selection "$SELECTION" \
            --warmup-seconds "$WARMUP_SECONDS" \
            --active-seconds "$ACTIVE_SECONDS" \
            --pairs "$PAIRS" \
            --policy "$BASE_POLICY" \
            "${plan_scale_arguments[@]}" \
            --output "$PERFORMANCE_PLAN"
      - name: Run interleaved A/A calibration and A/B schedule
        shell: bash
        run: |
          set -euo pipefail
          run_profile() {
            scenario=$1
            repository=$2
            evidence_directory=$3
            member=$4
            pair=$5
            order=$6
            bound_parent_sha=$7
            bound_candidate_sha=$8
            (
              cd "$repository"
              "$PROFILE_RUNNER" profile-workload \
                --scenario "$scenario" \
                --warmup-seconds "$WARMUP_SECONDS" \
                --active-seconds "$ACTIVE_SECONDS" \
                --repository-root "$repository" \
                --binary-dir "$repository/target/profiling" \
                --ready-file \
                  "profiles/$evidence_directory/$scenario-$member-$pair.ready" \
                --output \
                  "profiles/$evidence_directory/$scenario-$member-$pair.jsonl" \
                --parent-sha "$bound_parent_sha" \
                --candidate-sha "$bound_candidate_sha" \
                --member "$member" \
                --pair "$pair" \
                --order "$order" \
                --build-profile current \
                --unit "$TRIAL_UNIT" \
                --runner-image "$TRIAL_RUNNER_IMAGE" \
                --producer-source-sha256 "$TRIAL_PRODUCER_SHA256" \
                --controller-source-sha256 "$TRIAL_CONTROLLER_SHA256" \
                --semantic-recipe-sha256 "$TRIAL_RECIPE_SHA256" \
                --evidence-bundle-sha256 "$TRIAL_BUNDLE_SHA256"
            )
          }
          scenario_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            scenario_scale_arguments=(--scale-policy "$PERFORMANCE_SCALE_POLICY")
          fi
          mapfile -t scenarios < <(
            python3 -B -m tools.performance_candidate scenarios \
              --plan "$PERFORMANCE_PLAN" \
              --policy "$BASE_POLICY" \
              "${scenario_scale_arguments[@]}"
          )
          test "${#scenarios[@]}" -gt 0
          for scenario in "${scenarios[@]}"; do
            trial_contract="$(
              python3 -B -m tools.performance_candidate linux-trial-contract \
                --plan "$PERFORMANCE_PLAN" \
                --policy "$BASE_POLICY" \
                "${scenario_scale_arguments[@]}" \
                --scenario "$scenario" \
                --output-format tsv
            )"
            IFS=$'\t' read -r TRIAL_UNIT TRIAL_RUNNER_IMAGE \
              TRIAL_PRODUCER_SHA256 TRIAL_CONTROLLER_SHA256 \
              TRIAL_RECIPE_SHA256 TRIAL_BUNDLE_SHA256 <<<"$trial_contract"
            export TRIAL_UNIT TRIAL_RUNNER_IMAGE TRIAL_PRODUCER_SHA256 \
              TRIAL_CONTROLLER_SHA256 TRIAL_RECIPE_SHA256 TRIAL_BUNDLE_SHA256
            test -n "$TRIAL_UNIT"
            test -n "$TRIAL_RUNNER_IMAGE"
            test -n "$TRIAL_PRODUCER_SHA256"
            test -n "$TRIAL_CONTROLLER_SHA256"
            test -n "$TRIAL_RECIPE_SHA256"
            test -n "$TRIAL_BUNDLE_SHA256"
            schedule_arguments=()
            if [ "$SELF_CALIBRATED" = true ]; then
              schedule_arguments=(--self-calibrated)
            fi
            while IFS=$'\t' read -r source evidence_directory member pair order comparison; do
              if [ "$source" = parent ]; then
                repository="$PARENT_DIR"
              else
                test "$source" = candidate
                repository="$CANDIDATE_DIR"
              fi
              if [ "$comparison" = aa ]; then
                bound_candidate_sha="$PARENT_SHA"
              else
                test "$comparison" = ab
                bound_candidate_sha="$CANDIDATE_SHA"
              fi
              run_profile \
                "$scenario" \
                "$repository" \
                "$evidence_directory" \
                "$member" \
                "$pair" \
                "$order" \
                "$PARENT_SHA" \
                "$bound_candidate_sha"
            done < <(
              python3 -B -m tools.performance_candidate schedule \
                --plan "$PERFORMANCE_PLAN" \
                --policy "$BASE_POLICY" \
                "${scenario_scale_arguments[@]}" \
                --scenario "$scenario" \
                "${schedule_arguments[@]}"
            )
          done
          if [ "$SELF_CALIBRATED" = true ]; then
            calibration_source="artifact:github-actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/$SELECTION/self-calibration"
            python3 -B -m tools.performance_candidate calibrate \
              --base-policy "$BASE_POLICY" \
              --plan "$PERFORMANCE_PLAN" \
              --left-root "$PARENT_DIR/profiles/calibration-left" \
              --right-root "$PARENT_DIR/profiles/calibration-right" \
              --baseline-sha "$PARENT_SHA" \
              --source "$calibration_source" \
              --policy "$RUNTIME_POLICY" \
              --output "$CALIBRATION_REPORT"
            python3 -B -m tools.performance_candidate plan \
              --mode qualification \
              --selection "$SELECTION" \
              --warmup-seconds "$WARMUP_SECONDS" \
              --active-seconds "$ACTIVE_SECONDS" \
              --pairs "$PAIRS" \
              --policy "$RUNTIME_POLICY" \
              --output "$PERFORMANCE_PLAN"
            printf 'ACTIVE_POLICY=%s\n' "$RUNTIME_POLICY" >>"$GITHUB_ENV"
          fi
      - name: Summarize paired performance evidence
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          summary_status=0
          summary_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            summary_scale_arguments=(
              --scale-policy "$PERFORMANCE_SCALE_POLICY"
              --repository "$CONTROLLER_DIR"
            )
          fi
          python3 -B -m tools.performance_candidate summarize \
            --plan "$PERFORMANCE_PLAN" \
            --parent-root "$PARENT_DIR/profiles/paired" \
            --candidate-root "$CANDIDATE_DIR/profiles/paired" \
            --parent-sha "$PARENT_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --policy "$ACTIVE_POLICY" \
            "${summary_scale_arguments[@]}" \
            --output "$PERFORMANCE_SUMMARY" \
            --markdown "$PERFORMANCE_MARKDOWN" || summary_status=$?
          if [ -f "$PERFORMANCE_MARKDOWN" ]; then
            cat "$PERFORMANCE_MARKDOWN" >>"$GITHUB_STEP_SUMMARY" || summary_status=1
          else
            summary_status=1
          fi
          exit "$summary_status"
      - name: Stage bounded raw evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          copy_evidence() {
            source=$1
            destination=$2
            mkdir -p "$destination"
            if compgen -G "$source/*.jsonl" >/dev/null; then
              cp "$source"/*.jsonl "$destination/"
            fi
          }
          copy_evidence "$PARENT_DIR/profiles/paired" "$ARTIFACT_DIR/ab-parent"
          copy_evidence "$CANDIDATE_DIR/profiles/paired" "$ARTIFACT_DIR/ab-candidate"
          copy_evidence \
            "$PARENT_DIR/profiles/calibration-left" \
            "$ARTIFACT_DIR/aa-left"
          copy_evidence \
            "$PARENT_DIR/profiles/calibration-right" \
            "$ARTIFACT_DIR/aa-right"
          cp "$PERFORMANCE_SCALE_POLICY" "$ARTIFACT_DIR/scale-policy.json"
      - name: Upload paired raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-profile-${{ inputs.mode }}-${{ matrix.selection }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-artifact
          if-no-files-found: error
          retention-days: 30
      - name: Reap processes and remove product worktrees
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          for signal in TERM KILL; do
            for process in ferrum2-client ferrum2-server; do
              pkill "-$signal" -x "$process" 2>/dev/null || status=$?
              if [ "${status:-0}" -gt 1 ]; then cleanup_status=1; fi
              status=0
            done
            sleep 1
          done
          for process in ferrum2-client ferrum2-server; do
            if pgrep -x "$process" >/dev/null; then cleanup_status=1; fi
          done
          for worktree in "${PARENT_DIR:-}" "${CANDIDATE_DIR:-}"; do
            if [ -n "$worktree" ] && [ -e "$worktree" ]; then
              git worktree remove --force "$worktree" || cleanup_status=1
            fi
          done
          test "$cleanup_status" -eq 0

  aggregate-full-non-tun:
    name: aggregate full non-TUN qualification
    if: ${{ always() && inputs.mode == 'calibrated-qualification' && inputs.selection == 'full-non-tun' }}
    needs: paired-profile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Download group summaries
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: paired-profile-${{ inputs.mode }}-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-matrix
          merge-multiple: true
      - name: Aggregate complete non-TUN decision
        shell: bash
        run: |
          set -uo pipefail
          status=0
          mkdir -p "$RUNNER_TEMP/performance-aggregate"
          python3 -B -m tools.performance_candidate aggregate \
            --summary-root "$RUNNER_TEMP/performance-matrix" \
            --parent-sha "${{ inputs.parent_sha }}" \
            --candidate-sha "${{ inputs.candidate_sha }}" \
            --output "$RUNNER_TEMP/performance-aggregate/full-non-tun-summary.json" \
            --markdown "$RUNNER_TEMP/performance-aggregate/full-non-tun-summary.md" \
            || status=$?
          cat "$RUNNER_TEMP/performance-aggregate/full-non-tun-summary.md" \
            >>"$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - name: Upload complete non-TUN decision
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-non-tun-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-aggregate
          if-no-files-found: error
          retention-days: 30
