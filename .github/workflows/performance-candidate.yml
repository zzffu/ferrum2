name: performance-candidate

on:
  workflow_dispatch:
    inputs:
      run_kind:
        description: "Source comparison or same-commit A/A calibration"
        required: true
        type: choice
        default: comparison
        options:
          - comparison
          - calibration-aa
      mode:
        description: "Single-scenario diagnostic or guarded qualification"
        required: true
        type: choice
        default: qualification
        options:
          - qualification
          - diagnostic
      parent_sha:
        description: "Exact ancestor SHA, or exact H/final SHA for tcp-scale-10k"
        required: true
        type: string
      selection:
        description: "Linux paired workload or group; Windows TUN runs only in local Hyper-V"
        required: true
        type: choice
        default: tcp-stream-64k
        options:
          - tcp-bulk
          - tcp-stream-64k
          - tcp-request-1k
          - tcp-request-4k
          - tcp-request-16k
          - socks-direct-request-1k
          - socks-direct-request-4k
          - socks-direct-request-16k
          - udp-small-high
          - udp-mtu-1200
          - udp-payload-1472
          - udp-payload-1500
          - udp-payload-8192
          - udp-max-wire-65507
          - udp-direct-small-128
          - udp-direct-max-65497
          - udp-response-concurrency-1
          - udp-response-concurrency-8
          - udp-response-concurrency-32
          - udp-replay-sequential
          - dns-udp-concurrency
          - dns-cache-size-64
          - dns-cache-size-4096
          - dns-cache-size-65536
          - udp-payload-matrix
          - udp-direct-payload-bounds
          - tcp-frame-capacity
          - structural-baseline-matrix
          - tcp-scale-10k
      warmup_seconds:
        description: "Warmup seconds"
        required: true
        type: choice
        default: "3"
        options: ["1", "3", "5", "10"]
      active_seconds:
        description: "Measured seconds"
        required: true
        type: choice
        default: "30"
        options: ["15", "30", "60"]
      pairs:
        description: "Pre-registered six-pair ABBA schedule"
        required: true
        type: choice
        default: "6"
        options: ["6"]

permissions:
  contents: read

jobs:
  paired-profile:
    name: paired-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
      RUN_KIND: ${{ inputs.run_kind }}
      REQUESTED_PARENT_SHA: ${{ inputs.parent_sha }}
      MODE: ${{ inputs.mode }}
      SELECTION: ${{ inputs.selection }}
      WARMUP_SECONDS: ${{ inputs.warmup_seconds }}
      ACTIVE_SECONDS: ${{ inputs.active_seconds }}
      PAIRS: ${{ inputs.pairs }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Require preferred AMD performance host
        shell: bash
        run: |
          set -euo pipefail
          vendor_id="$(awk -F ': ' '/^vendor_id[[:space:]]*:/ { print $2; exit }' /proc/cpuinfo)"
          cpu_model="$(awk -F ': ' '/^model name[[:space:]]*:/ { print $2; exit }' /proc/cpuinfo)"
          if [ "$vendor_id" != AuthenticAMD ]; then
            echo "::error::Performance qualification prefers an AMD host; observed ${vendor_id:-unknown} / ${cpu_model:-unknown}. Re-run this workflow to obtain an AMD runner."
            exit 1
          fi
          printf 'Selected preferred AMD performance host: %s\n' "$cpu_model"
      - name: Bind exact parent and runner identity
        shell: bash
        run: |
          set -euo pipefail
          PARENT_DIR="$RUNNER_TEMP/ferrum2-parent"
          CANDIDATE_DIR="$GITHUB_WORKSPACE"
          PERFORMANCE_PLAN="$RUNNER_TEMP/performance-plan.json"
          PERFORMANCE_CALIBRATION_CANDIDATE="$RUNNER_TEMP/linux-calibration-candidate.json"
          PERFORMANCE_POLICY="$GITHUB_WORKSPACE/tools/performance_candidate_policy.json"
          PERFORMANCE_SCALE_POLICY="$GITHUB_WORKSPACE/tools/performance_candidate_scale_safety_policy.json"
          SCALE_LINEAGE="$RUNNER_TEMP/performance-scale-lineage.json"
          case "$RUN_KIND" in
            calibration-aa) RUN_ROUNDS=2 ;;
            comparison) RUN_ROUNDS=1 ;;
            *) exit 1 ;;
          esac
          if [ "$RUN_KIND" = calibration-aa ]; then
            test "$MODE/$WARMUP_SECONDS/$ACTIVE_SECONDS/$PAIRS" = \
              "qualification/3/30/6"
          fi
          {
            printf 'PARENT_DIR=%s\n' "$PARENT_DIR"
            printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR"
            printf 'PERFORMANCE_PLAN=%s\n' "$PERFORMANCE_PLAN"
            printf 'PERFORMANCE_CALIBRATION_CANDIDATE=%s\n' \
              "$PERFORMANCE_CALIBRATION_CANDIDATE"
            printf 'PERFORMANCE_POLICY=%s\n' "$PERFORMANCE_POLICY"
            printf 'PERFORMANCE_SCALE_POLICY=%s\n' "$PERFORMANCE_SCALE_POLICY"
            printf 'SCALE_LINEAGE=%s\n' "$SCALE_LINEAGE"
            printf 'RUN_ROUNDS=%s\n' "$RUN_ROUNDS"
          } >>"$GITHUB_ENV"
          [[ "$REQUESTED_PARENT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          REQUESTED_PARENT_SHA="${REQUESTED_PARENT_SHA,,}"
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_OS/$RUNNER_ARCH" = "Linux/X64"
          for process in ferrum2-client ferrum2-server; do
            ! pgrep -x "$process" >/dev/null
          done
          rustup toolchain install 1.97.1 --profile minimal
          rustc +1.97.1 -Vv
          test ! -e "$PARENT_DIR"
          if [ "$SELECTION" = tcp-scale-10k ]; then
            test "$RUN_KIND" = comparison
            test "$MODE/$WARMUP_SECONDS/$ACTIVE_SECONDS/$PAIRS" = "qualification/10/30/6"
            H_SHA="$REQUESTED_PARENT_SHA"
            test "$(git rev-parse "$H_SHA^{commit}")" = "$H_SHA"
            CANDIDATE_SHA="$(git rev-parse HEAD)"
            PARENT_SHA="$(git rev-parse "$CANDIDATE_SHA^")"
            test "$(git rev-parse "$PARENT_SHA^")" = "$H_SHA"
            test "$(git rev-list --parents -n 1 "$PARENT_SHA" | wc -w)" -eq 2
            test "$(git rev-list --parents -n 1 "$CANDIDATE_SHA" | wc -w)" -eq 2
            test "$(git rev-parse "$CANDIDATE_SHA^{tree}")" = \
              "$(git rev-parse "$H_SHA^{tree}")"
            python3 -B -m tools.performance_candidate scale-source-lineage \
              --repository "$GITHUB_WORKSPACE" \
              --head-sha "$H_SHA" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA"
            git worktree add --detach "$PARENT_DIR" "$PARENT_SHA"
          else
            H_SHA="$GITHUB_SHA"
            CANDIDATE_SHA="$GITHUB_SHA"
            if [ "$RUN_KIND" = calibration-aa ]; then
              PARENT_SHA="$CANDIDATE_SHA"
              test "$REQUESTED_PARENT_SHA" = "$CANDIDATE_SHA"
            else
              PARENT_SHA="$REQUESTED_PARENT_SHA"
            fi
            python3 -B -m tools.performance_candidate validate-git \
              --repository "$GITHUB_WORKSPACE" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA" \
              --run-kind "$RUN_KIND"
            git worktree add --detach "$PARENT_DIR" "$PARENT_SHA"
          fi
          {
            printf 'H_SHA=%s\n' "$H_SHA"
            printf 'PARENT_SHA=%s\n' "$PARENT_SHA"
            printf 'CANDIDATE_SHA=%s\n' "$CANDIDATE_SHA"
            printf 'CANDIDATE_DIR=%s\n' "$CANDIDATE_DIR"
          } >>"$GITHUB_ENV"
          exclude="$(git rev-parse --git-path info/exclude)"
          printf '/profiles/\n' >>"$exclude"
      - name: Preflight reviewed comparison host applicability
        if: ${{ inputs.run_kind == 'comparison' && inputs.selection != 'tcp-scale-10k' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.performance_candidate plan \
            --run-kind "$RUN_KIND" \
            --mode "$MODE" \
            --selection "$SELECTION" \
            --warmup-seconds "$WARMUP_SECONDS" \
            --active-seconds "$ACTIVE_SECONDS" \
            --pairs "$PAIRS" \
            --policy "$PERFORMANCE_POLICY" \
            --output "$PERFORMANCE_PLAN"
          python3 -B - "$PERFORMANCE_PLAN" <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          from tools.performance_candidate.linux.plan import load_plan
          from tools.performance_candidate.linux.policy import (
              _scenario_policy_is_applicable,
          )


          def first_line(command: list[str]) -> str:
              completed = subprocess.run(
                  command,
                  check=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              lines = completed.stdout.splitlines()
              if not lines or not lines[0]:
                  raise RuntimeError(f"host identity probe produced no output: {command[0]}")
              return lines[0][:512]


          def linux_capacity() -> tuple[int, str]:
              meminfo = pathlib.Path("/proc/meminfo").read_text(encoding="utf-8")
              memory_text = next(
                  (
                      line.removeprefix("MemTotal:").split()[0]
                      for line in meminfo.splitlines()
                      if line.startswith("MemTotal:")
                  ),
                  None,
              )
              cpuinfo = pathlib.Path("/proc/cpuinfo").read_text(encoding="utf-8")
              prefix = "model name\t: "
              cpu_model = next(
                  (
                      line.removeprefix(prefix)
                      for line in cpuinfo.splitlines()
                      if line.startswith(prefix)
                  ),
                  None,
              )
              if memory_text is None or cpu_model is None:
                  raise RuntimeError("Linux host capacity identity is unavailable")
              memory_kib = int(memory_text)
              if memory_kib <= 0 or not cpu_model:
                  raise RuntimeError("Linux host capacity identity is invalid")
              return memory_kib, cpu_model


          def host_summary(environment: dict[str, object]) -> dict[str, object]:
              return {
                  "cpu_model": environment.get("cpu_model"),
                  "cpu_count": environment.get("cpu_count"),
                  "memory_kib": environment.get("memory_kib"),
              }


          plan = load_plan(pathlib.Path(sys.argv[1]))
          memory_kib, cpu_model = linux_capacity()
          cpu_count = os.cpu_count()
          if type(cpu_count) is not int or cpu_count <= 0:
              raise RuntimeError("Linux logical CPU count is unavailable")
          observed_environment = {
              "rustc": first_line(["rustc", "+1.97.1", "-V"]),
              # This is the exact M4 kernel probe: uname -a without the
              # ephemeral node name, which must not enter evidence identity.
              "kernel": first_line(["uname", "-srvmo"]),
              "cpu_model": cpu_model,
              "cpu_count": cpu_count,
              "memory_kib": memory_kib,
              "build_profile": "current",
          }
          failures: list[tuple[str, str, dict[str, object] | None]] = []
          policy = plan["decision_policy"]
          for scenario_plan in plan["scenarios"]:
              scenario = scenario_plan["scenario"]
              entry = policy["scenarios"][scenario]
              expected_environment = entry["calibration_environment"]
              if expected_environment is None:
                  failures.append((scenario, "no reviewed calibration", None))
                  continue
              if not _scenario_policy_is_applicable(
                  entry=entry,
                  scenario_plan=scenario_plan,
                  warmup_seconds=plan["warmup_seconds"],
                  active_seconds=plan["active_seconds"],
                  pairs=plan["pairs"],
                  observed_environment=observed_environment,
              ):
                  failures.append(
                      (scenario, "reviewed calibration is not applicable", expected_environment)
                  )

          if failures:
              print(
                  "comparison host applicability preflight failed; "
                  "no correctness or release build was started",
                  file=sys.stderr,
              )
              print(
                  "observed host summary: "
                  + json.dumps(host_summary(observed_environment), sort_keys=True),
                  file=sys.stderr,
              )
              for scenario, reason, expected_environment in failures:
                  print(f"{scenario}: {reason}", file=sys.stderr)
                  if expected_environment is not None:
                      print(
                          "expected host summary: "
                          + json.dumps(host_summary(expected_environment), sort_keys=True),
                          file=sys.stderr,
                      )
              sys.exit(1)

          print(
              "comparison host applicability preflight passed: "
              + json.dumps(host_summary(observed_environment), sort_keys=True)
          )
          PY
      - name: Prove parent and candidate correctness and build identities
        shell: bash
        run: |
          set -euo pipefail
          for repository in "$PARENT_DIR" "$CANDIDATE_DIR"; do
            (
              cd "$repository"
              test "$(git status --porcelain)" = ""
              cargo +1.97.1 build \
                -p ferrum2-client -p ferrum2-server --bins --locked
              cargo +1.97.1 test --workspace \
                --exclude ferrum2-client \
                --exclude ferrum2-tun \
                --exclude ferrum2-platform-windows \
                --exclude ferrum2-m0-harness \
                --locked
              cargo +1.97.1 test \
                -p ferrum2-client \
                -p ferrum2-tun \
                -p ferrum2-platform-windows \
                --all-features --no-run --locked
              cargo +1.97.1 test \
                -p ferrum2-m0-harness --no-run --locked
              cargo +1.97.1 build --profile profiling \
                -p ferrum2-client -p ferrum2-server --bins --locked
            )
          done
          (
            cd "$CANDIDATE_DIR"
            cargo +1.97.1 build --profile profiling \
              -p ferrum2-m4-qualification --bins --locked
            target/profiling/m4-qualification self-check
          )
          if [ "$RUN_KIND" = calibration-aa ]; then
            # A/A measures scheduling and runner noise, not independent linker
            # nondeterminism or absolute-path debug metadata. Both schedule
            # members therefore execute the exact same candidate-built bits.
            install -m 0755 \
              "$CANDIDATE_DIR/target/profiling/ferrum2-client" \
              "$PARENT_DIR/target/profiling/ferrum2-client"
            install -m 0755 \
              "$CANDIDATE_DIR/target/profiling/ferrum2-server" \
              "$PARENT_DIR/target/profiling/ferrum2-server"
            cmp \
              "$CANDIDATE_DIR/target/profiling/ferrum2-client" \
              "$PARENT_DIR/target/profiling/ferrum2-client"
            cmp \
              "$CANDIDATE_DIR/target/profiling/ferrum2-server" \
              "$PARENT_DIR/target/profiling/ferrum2-server"
          fi
          plan_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            python3 -B -m tools.performance_candidate scale-lineage \
              --repository "$GITHUB_WORKSPACE" \
              --head-sha "$H_SHA" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA" \
              --runner "$CANDIDATE_DIR/target/profiling/m4-qualification" \
              --parent-client "$PARENT_DIR/target/profiling/ferrum2-client" \
              --parent-server "$PARENT_DIR/target/profiling/ferrum2-server" \
              --candidate-client "$CANDIDATE_DIR/target/profiling/ferrum2-client" \
              --candidate-server "$CANDIDATE_DIR/target/profiling/ferrum2-server" \
              --output "$SCALE_LINEAGE"
            plan_scale_arguments=(
              --scale-policy "$PERFORMANCE_SCALE_POLICY"
              --scale-lineage "$SCALE_LINEAGE"
            )
          fi
          python3 -B -m tools.performance_candidate plan \
            --run-kind "$RUN_KIND" \
            --mode "$MODE" \
            --selection "$SELECTION" \
            --warmup-seconds "$WARMUP_SECONDS" \
            --active-seconds "$ACTIVE_SECONDS" \
            --pairs "$PAIRS" \
            --policy "$PERFORMANCE_POLICY" \
            "${plan_scale_arguments[@]}" \
            --output "$PERFORMANCE_PLAN"
      - name: Run pre-registered six-pair ABBA schedule
        shell: bash
        run: |
          set -euo pipefail
          run_member() {
            scenario=$1
            member=$2
            pair=$3
            order=$4
            round=$5
            if [ "$member" = parent ]; then
              repository=$PARENT_DIR
            else
              repository=$CANDIDATE_DIR
            fi
            (
              cd "$repository"
              # Use one candidate-built harness for both members so new scenario
              # definitions are identical; the explicit paths still bind and hash
              # each member's exact checkout and client/server binaries.
              "$CANDIDATE_DIR/target/profiling/m4-qualification" profile-workload \
                --scenario "$scenario" \
                --warmup-seconds "$WARMUP_SECONDS" \
                --active-seconds "$ACTIVE_SECONDS" \
                --repository-root "$repository" \
                --binary-dir "$repository/target/profiling" \
                --ready-file "profiles/paired/round-$round/$scenario-$member-$pair.ready" \
                --output "profiles/paired/round-$round/$scenario-$member-$pair.jsonl" \
                --parent-sha "$PARENT_SHA" \
                --candidate-sha "$CANDIDATE_SHA" \
                --member "$member" \
                --pair "$pair" \
                --order "$order" \
                --build-profile current \
                --unit "$TRIAL_UNIT" \
                --runner-image "$TRIAL_RUNNER_IMAGE" \
                --producer-source-sha256 "$TRIAL_PRODUCER_SHA256" \
                --controller-source-sha256 "$TRIAL_CONTROLLER_SHA256" \
                --semantic-recipe-sha256 "$TRIAL_RECIPE_SHA256" \
                --evidence-bundle-sha256 "$TRIAL_BUNDLE_SHA256"
            )
          }
          scenario_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            scenario_scale_arguments=(--scale-policy "$PERFORMANCE_SCALE_POLICY")
          fi
          mapfile -t scenarios < <(
            python3 -B -m tools.performance_candidate scenarios \
              --plan "$PERFORMANCE_PLAN" \
              --policy "$PERFORMANCE_POLICY" \
              "${scenario_scale_arguments[@]}"
          )
          test "${#scenarios[@]}" -gt 0
          for round in $(seq 1 "$RUN_ROUNDS"); do
            for scenario in "${scenarios[@]}"; do
              trial_contract="$(
                python3 -B -m tools.performance_candidate linux-trial-contract \
                  --plan "$PERFORMANCE_PLAN" \
                  --policy "$PERFORMANCE_POLICY" \
                  "${scenario_scale_arguments[@]}" \
                  --scenario "$scenario" \
                  --output-format tsv
              )"
              IFS=$'\t' read -r TRIAL_UNIT TRIAL_RUNNER_IMAGE \
                TRIAL_PRODUCER_SHA256 TRIAL_CONTROLLER_SHA256 \
                TRIAL_RECIPE_SHA256 TRIAL_BUNDLE_SHA256 <<<"$trial_contract"
              export TRIAL_UNIT TRIAL_RUNNER_IMAGE TRIAL_PRODUCER_SHA256 \
                TRIAL_CONTROLLER_SHA256 TRIAL_RECIPE_SHA256 TRIAL_BUNDLE_SHA256
              test -n "$TRIAL_UNIT"
              test -n "$TRIAL_RUNNER_IMAGE"
              test -n "$TRIAL_PRODUCER_SHA256"
              test -n "$TRIAL_CONTROLLER_SHA256"
              test -n "$TRIAL_RECIPE_SHA256"
              test -n "$TRIAL_BUNDLE_SHA256"
              for pair in $(seq 1 "$PAIRS"); do
                if ((pair % 2 == 1)); then
                  run_member "$scenario" parent "$pair" 1 "$round"
                  run_member "$scenario" candidate "$pair" 2 "$round"
                else
                  run_member "$scenario" candidate "$pair" 1 "$round"
                  run_member "$scenario" parent "$pair" 2 "$round"
                fi
              done
            done
          done
      - name: Summarize paired performance evidence
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          summary_status=0
          summary_scale_arguments=()
          if [ "$SELECTION" = tcp-scale-10k ]; then
            summary_scale_arguments=(
              --scale-policy "$PERFORMANCE_SCALE_POLICY"
              --repository "$GITHUB_WORKSPACE"
            )
          fi
          for round in $(seq 1 "$RUN_ROUNDS"); do
            round_summary="$RUNNER_TEMP/performance-summary-round-$round.json"
            round_markdown="$RUNNER_TEMP/performance-summary-round-$round.md"
            round_status=0
            python3 -B -m tools.performance_candidate summarize \
              --plan "$PERFORMANCE_PLAN" \
              --parent-root "$PARENT_DIR/profiles/paired/round-$round" \
              --candidate-root "$CANDIDATE_DIR/profiles/paired/round-$round" \
              --parent-sha "$PARENT_SHA" \
              --candidate-sha "$CANDIDATE_SHA" \
              --policy "$PERFORMANCE_POLICY" \
              "${summary_scale_arguments[@]}" \
              --output "$round_summary" \
              --markdown "$round_markdown" || round_status=$?
            if [ "$round_status" -ne 0 ]; then
              summary_status=$round_status
            fi
            if [ -f "$round_markdown" ]; then
              if ! cat "$round_markdown" >>"$GITHUB_STEP_SUMMARY"; then
                if [ "$summary_status" -eq 0 ]; then
                  summary_status=1
                fi
              fi
            elif [ "$summary_status" -eq 0 ]; then
              summary_status=1
            fi
          done
          if [ "$RUN_KIND" = calibration-aa ] \
            && [ "$summary_status" -eq 0 ]; then
            calibration_status=0
            python3 -B -m tools.performance_candidate \
              linux-calibration-candidate \
              --summary "$RUNNER_TEMP/performance-summary-round-1.json" \
              --summary "$RUNNER_TEMP/performance-summary-round-2.json" \
              --output "$PERFORMANCE_CALIBRATION_CANDIDATE" \
              || calibration_status=$?
            if [ "$calibration_status" -ne 0 ]; then
              summary_status=$calibration_status
            fi
          fi
          exit "$summary_status"
      - name: Upload paired raw evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paired-profile-${{ inputs.run_kind }}-${{ inputs.mode }}-${{ inputs.selection }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/profiles/paired/**/*.jsonl
            ${{ runner.temp }}/ferrum2-parent/profiles/paired/**/*.jsonl
            ${{ runner.temp }}/performance-plan.json
            ${{ runner.temp }}/performance-summary-round-*.json
            ${{ runner.temp }}/performance-summary-round-*.md
            ${{ runner.temp }}/linux-calibration-candidate.json
            ${{ runner.temp }}/performance-scale-lineage.json
            ${{ github.workspace }}/tools/performance_candidate_policy.json
            ${{ github.workspace }}/tools/performance_candidate_scale_safety_policy.json
          if-no-files-found: error
          retention-days: 30
      - name: Reap processes and remove parent worktree
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          for signal in TERM KILL; do
            for process in ferrum2-client ferrum2-server; do
              pkill "-$signal" -x "$process" 2>/dev/null || status=$?
              if [ "${status:-0}" -gt 1 ]; then cleanup_status=1; fi
              status=0
            done
            sleep 1
          done
          for process in ferrum2-client ferrum2-server; do
            if pgrep -x "$process" >/dev/null; then cleanup_status=1; fi
          done
          for worktree in "${PARENT_DIR:-}" "${CANDIDATE_DIR:-}"; do
            if [ -n "$worktree" ] \
              && [ "$worktree" != "$GITHUB_WORKSPACE" ] \
              && [ -e "$worktree" ]; then
              git worktree remove --force "$worktree" || cleanup_status=1
            fi
          done
          test "$cleanup_status" -eq 0

  structural-diagnostic:
    name: structural-diagnostic
    needs: paired-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
      STRUCTURAL_TARGET_DIR: ${{ github.workspace }}/target/structural-diagnostic
      STRUCTURAL_EVIDENCE: ${{ github.workspace }}/profiles/structural/m18-structural-trial-v7.json
    steps:
      - name: Checkout exact structural candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Require preferred AMD structural host
        shell: bash
        run: |
          set -euo pipefail
          vendor_id="$(awk -F ': ' '/^vendor_id[[:space:]]*:/ { print $2; exit }' /proc/cpuinfo)"
          cpu_model="$(awk -F ': ' '/^model name[[:space:]]*:/ { print $2; exit }' /proc/cpuinfo)"
          if [ "$vendor_id" != AuthenticAMD ]; then
            echo "::error::Structural diagnostics prefer an AMD host; observed ${vendor_id:-unknown} / ${cpu_model:-unknown}. Re-run this workflow to obtain an AMD runner."
            exit 1
          fi
          printf 'Selected preferred AMD structural host: %s\n' "$cpu_model"
      - name: Build isolated feature-on structural binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build \
            --profile profiling \
            --target-dir "$STRUCTURAL_TARGET_DIR" \
            --locked \
            -p ferrum2-client \
            -p ferrum2-server \
            -p ferrum2-m4-qualification \
            --features ferrum2-client/structural-metrics,ferrum2-server/structural-metrics,ferrum2-m4-qualification/structural-diagnostic
      - name: Collect non-authoritative structural evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$STRUCTURAL_EVIDENCE")"
          "$STRUCTURAL_TARGET_DIR/profiling/m4-qualification" structural-diagnostic \
            --repository-root "$GITHUB_WORKSPACE" \
            --binary-dir "$STRUCTURAL_TARGET_DIR/profiling" \
            --output "$STRUCTURAL_EVIDENCE" \
            --candidate-sha "$GITHUB_SHA" \
            --warmup-seconds 1 \
            --active-seconds 15
      - name: Recompute schema-v7 structural evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.performance_candidate validate-structural-diagnostic \
            --evidence "$STRUCTURAL_EVIDENCE" \
            --repository "$GITHUB_WORKSPACE" \
            --runner "$STRUCTURAL_TARGET_DIR/profiling/m4-qualification" \
            --client "$STRUCTURAL_TARGET_DIR/profiling/ferrum2-client" \
            --server "$STRUCTURAL_TARGET_DIR/profiling/ferrum2-server" \
            --candidate-sha "$GITHUB_SHA"
      - name: Upload validated structural evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: structural-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/profiles/structural/m18-structural-trial-v7.json
          if-no-files-found: error
          retention-days: 30
      - name: Reap structural diagnostic processes
        if: ${{ always() }}
        shell: bash
        run: |
          set -u
          cleanup_status=0
          for signal in TERM KILL; do
            for process in ferrum2-client ferrum2-server; do
              pkill "-$signal" -x "$process" 2>/dev/null || status=$?
              if [ "${status:-0}" -gt 1 ]; then cleanup_status=1; fi
              status=0
            done
            sleep 1
          done
          for process in ferrum2-client ferrum2-server; do
            if pgrep -x "$process" >/dev/null; then cleanup_status=1; fi
          done
          test "$cleanup_status" -eq 0
