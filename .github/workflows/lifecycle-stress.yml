name: lifecycle-stress

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      windows_tun_profile:
        description: "Opt-in privileged profile for the approved Hyper-V guest"
        required: true
        type: choice
        default: none
        options:
          - none
          - route-detect
          - restart-10
          - restart-100
          - restart-1000
          - fragments
          - dual-stack-dns
          - udp-policy
          - scheduler-ring-full
          - hard-kill
      windows_tun_identity_ledger:
        description: "Absolute path to the host-issued guest identity ledger"
        required: false
        type: string

permissions:
  contents: read

jobs:
  lifecycle-cycles:
    name: lifecycle-cycles
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify candidate and run repeated lifecycle qualification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build -p ferrum2-client -p ferrum2-server --bins --locked
          timeout --signal=TERM --kill-after=30s 30m \
            cargo +1.97.1 test -p ferrum2-m0-harness --test lifecycle_cycles \
              full_qualification_runs_twenty_cycles_per_category_and_at_least_100_per_binary \
              --locked -- --ignored --exact --nocapture

  windows-tun-guest:
    name: windows-tun-guest-${{ inputs.windows_tun_profile }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_tun_profile != 'none' }}
    runs-on: [self-hosted, Windows, X64, ferrum2-hyperv-guest]
    timeout-minutes: 360
    env:
      FERRUM2_TUN_PROFILE: ${{ inputs.windows_tun_profile }}
      FERRUM2_TUN_IDENTITY_LEDGER: ${{ inputs.windows_tun_identity_ledger }}
      FERRUM2_TUN_RUN_TOKEN: ${{ github.run_id }}-${{ github.run_attempt }}-lifecycle
    steps:
      - name: Checkout exact current SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 10
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Verify exact approved Hyper-V guest and candidate
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          if (git status --porcelain) { throw "dirty checkout" }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw "SHA mismatch" }
          if ($env:RUNNER_OS -ne "Windows" -or $env:RUNNER_ARCH -ne "X64") { throw "runner mismatch" }
          $computer = Get-CimInstance -ClassName Win32_ComputerSystem -ErrorAction Stop
          if ($computer.Manufacturer -cne "Microsoft Corporation" -or $computer.Model -cne "Virtual Machine") {
            throw "privileged qualification is restricted to a Hyper-V guest"
          }
          if ([string]::IsNullOrWhiteSpace($env:FERRUM2_TUN_IDENTITY_LEDGER)) {
            throw "identity ledger input is required"
          }
          if (-not [IO.Path]::IsPathFullyQualified($env:FERRUM2_TUN_IDENTITY_LEDGER)) {
            throw "identity ledger input must be absolute"
          }
          $ledgerPath = (Resolve-Path -LiteralPath $env:FERRUM2_TUN_IDENTITY_LEDGER).Path
          $ledgerItem = Get-Item -LiteralPath $ledgerPath -Force
          if ($ledgerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "identity ledger must not be a reparse point"
          }
          $ledger = Get-Content -LiteralPath $ledgerPath -Raw -Encoding utf8 | ConvertFrom-Json -Depth 4
          if ($ledger.schema -isnot [long] -or $ledger.schema -ne 1 -or
              $ledger.vm_name -cne "Windows 10 MSIX packaging environment" -or
              $ledger.vm_id -cne "82e20295-1d30-48e7-a751-e21d35d872d4" -or
              $ledger.checkpoint_name -cne "Ferrum2-TCP08-min-runtime-20260817T172815Z-581D60045FB9" -or
              $ledger.checkpoint_id -cne "1e570209-faf7-4248-8167-aa0687cdb8cf" -or
              $ledger.candidate_sha -cne $env:GITHUB_SHA.ToLowerInvariant()) {
            throw "identity ledger does not name the approved guest"
          }
          $ledgerHash = (Get-FileHash -LiteralPath $ledgerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "FERRUM2_TUN_IDENTITY_SHA256=$ledgerHash" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build exact candidate and acquire pinned Wintun
        shell: pwsh
        timeout-minutes: 50
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 build -p ferrum2-client -p ferrum2-server --bins --locked
          $archive = Join-Path $env:RUNNER_TEMP "wintun-0.14.1.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51") {
            throw "Wintun ZIP hash mismatch"
          }
      - name: Run selected guest-only lifecycle contract
        id: guest_qualification
        shell: pwsh
        timeout-minutes: 240
        env:
          FERRUM2_WINTUN_ZIP: ${{ runner.temp }}\wintun-0.14.1.zip
        run: |
          $ErrorActionPreference = "Stop"
          $profile = $env:FERRUM2_TUN_PROFILE
          $mode = $profile
          $cycles = 10
          if ($mode -match '^restart-(10|100|1000)$') {
            $cycles = [int]$Matches[1]
            $mode = "restart-stress"
          }
          $m17Modes = @(
            "route-detect", "restart-stress", "fragments", "dual-stack-dns",
            "udp-policy", "scheduler-ring-full"
          )
          $isHardKill = $mode -ceq "hard-kill"
          if (-not $isHardKill -and $mode -notin $m17Modes) {
            throw "closed profile dispatch rejected"
          }
          $artifactPrefix = if ($isHardKill) { "ferrum2-hard-kill" } else { "ferrum2-m17" }
          $artifact = Join-Path $env:RUNNER_TEMP "$artifactPrefix-$env:FERRUM2_TUN_RUN_TOKEN"
          if (Test-Path -LiteralPath $artifact) { throw "artifact baseline is not absent" }
          New-Item -ItemType Directory -Path $artifact | Out-Null
          if ((Get-Item -LiteralPath $artifact -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
            throw "artifact directory must not be a reparse point"
          }
          $arguments = @(
            "-NoProfile", "-File", "tests/platform/qualify_windows_tun.ps1",
            "-Mode", $mode,
            "-RunToken", $env:FERRUM2_TUN_RUN_TOKEN,
            "-IdentityLedger", $env:FERRUM2_TUN_IDENTITY_LEDGER,
            "-ClientBinary", (Resolve-Path "target/debug/ferrum2-client.exe").Path,
            "-ServerBinary", (Resolve-Path "target/debug/ferrum2-server.exe").Path
          )
          if (-not $isHardKill) {
            $arguments += @("-ArtifactDirectory", $artifact)
            if ($mode -eq "restart-stress") { $arguments += @("-RestartCycles", "$cycles") }
            & pwsh @arguments
            if ($LASTEXITCODE -ne 0) { throw "$mode guest qualification failed" }
            return
          }

          function Invoke-CapturedPwsh(
            [string[]]$Arguments,
            [string]$StdoutPath,
            [string]$StderrPath
          ) {
            if ((Test-Path -LiteralPath $StdoutPath) -or (Test-Path -LiteralPath $StderrPath)) {
              throw "hard-kill controller log baseline is not absent"
            }
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = (Get-Command pwsh -ErrorAction Stop).Source
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($argument in $Arguments) { $start.ArgumentList.Add($argument) }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            [void]$process.Start()
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            $process.WaitForExit()
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            [IO.File]::WriteAllText($StdoutPath, $stdout, [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($StderrPath, $stderr, [Text.UTF8Encoding]::new($false))
            if ($stdout.Length -ne 0) { [Console]::Out.Write($stdout) }
            if ($stderr.Length -ne 0) { [Console]::Error.Write($stderr) }
            $exitCode = $process.ExitCode
            $process.Dispose()
            return $exitCode
          }

          $stdoutPath = Join-Path $artifact "controller.stdout.log"
          $stderrPath = Join-Path $artifact "controller.stderr.log"
          $exitCode = Invoke-CapturedPwsh $arguments $stdoutPath $stderrPath
          if ($exitCode -ne 0) { throw "hard-kill guest qualification failed with exit code $exitCode" }

          $ledgerPath = (Resolve-Path -LiteralPath $env:FERRUM2_TUN_IDENTITY_LEDGER).Path
          $ledgerHash = (Get-FileHash -LiteralPath $ledgerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ledgerHash -cne $env:FERRUM2_TUN_IDENTITY_SHA256) {
            throw "hard-kill identity ledger changed after preflight"
          }
          $ledger = Get-Content -LiteralPath $ledgerPath -Raw -Encoding utf8 | ConvertFrom-Json -Depth 4
          $clientPath = (Resolve-Path "target/debug/ferrum2-client.exe").Path
          $serverPath = (Resolve-Path "target/debug/ferrum2-server.exe").Path
          $controllerPath = (Resolve-Path "tests/platform/qualify_windows_tun.ps1").Path
          $clientHash = (Get-FileHash -LiteralPath $clientPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $serverHash = (Get-FileHash -LiteralPath $serverPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $controllerHash = (Get-FileHash -LiteralPath $controllerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ledger.candidate_sha -cne $env:GITHUB_SHA.ToLowerInvariant() -or
              $ledger.client_sha256 -cne $clientHash -or $ledger.server_sha256 -cne $serverHash -or
              $ledger.probe_sha256 -cne $controllerHash) {
            throw "hard-kill candidate identity readback failed"
          }

          $expectedMarker = "m16_windows_hard_kill status=PASS cases=3/3 process_absent=PASS adapter=ABSENT addresses=ABSENT routes=ABSENT dns=ABSENT cleanup=PASS guest_build=$($ledger.guest_build) run_token=$env:FERRUM2_TUN_RUN_TOKEN candidate_sha=$($ledger.candidate_sha) probe_sha256=$($ledger.probe_sha256) identity_sha256=$ledgerHash"
          $stdoutLines = @(Get-Content -LiteralPath $stdoutPath -Encoding utf8)
          $markers = @($stdoutLines | Where-Object { $_ -ceq $expectedMarker })
          $terminalLines = @($stdoutLines | Where-Object { $_.StartsWith("m16_windows_hard_kill ", [StringComparison]::Ordinal) })
          $nonemptyStdout = @($stdoutLines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($markers.Count -ne 1 -or $terminalLines.Count -ne 1 -or
              $nonemptyStdout.Count -eq 0 -or $nonemptyStdout[-1] -cne $expectedMarker) {
            throw "hard-kill terminal success marker is missing, duplicated, or not terminal"
          }

          $evidenceSource = "$ledgerPath.evidence-$env:FERRUM2_TUN_RUN_TOKEN.jsonl"
          if (-not (Test-Path -LiteralPath $evidenceSource -PathType Leaf)) {
            throw "hard-kill capability evidence is missing"
          }
          $evidenceItem = Get-Item -LiteralPath $evidenceSource -Force
          if ($evidenceItem.Length -le 0 -or $evidenceItem.Length -gt 1048576 -or
              ($evidenceItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "hard-kill capability evidence boundary is invalid"
          }
          $evidenceLines = @(Get-Content -LiteralPath $evidenceSource -Encoding utf8)
          $expectedPhases = @("hard-kill-auto-route", "hard-kill-auto-dns", "hard-kill-mixed")
          if ($evidenceLines.Count -ne $expectedPhases.Count) {
            throw "hard-kill capability evidence row count is invalid"
          }
          for ($index = 0; $index -lt $expectedPhases.Count; $index++) {
            $json = [Text.Json.JsonDocument]::Parse($evidenceLines[$index])
            try {
              $properties = @($json.RootElement.EnumerateObject())
              if (($properties.Name -join "|") -cne "schema|phase|timestamp_utc|data" -or
                  $properties[0].Value.ValueKind -ne [Text.Json.JsonValueKind]::Number -or
                  $properties[0].Value.GetInt64() -ne 1 -or
                  $properties[1].Value.ValueKind -ne [Text.Json.JsonValueKind]::String -or
                  $properties[1].Value.GetString() -cne $expectedPhases[$index] -or
                  $properties[2].Value.ValueKind -ne [Text.Json.JsonValueKind]::String -or
                  $properties[3].Value.ValueKind -ne [Text.Json.JsonValueKind]::Object) {
                throw "hard-kill capability evidence identity is invalid"
              }
              [DateTimeOffset]$timestamp = [DateTimeOffset]::MinValue
              if (-not [DateTimeOffset]::TryParseExact(
                  $properties[2].Value.GetString(), "o", [Globalization.CultureInfo]::InvariantCulture,
                  [Globalization.DateTimeStyles]::RoundtripKind, [ref]$timestamp
                ) -or $timestamp.Offset -ne [TimeSpan]::Zero) {
                throw "hard-kill capability evidence timestamp is invalid"
              }
              $data = @($properties[3].Value.EnumerateObject())
              $expectedDataNames = @("process", "adapter", "addresses", "routes", "dns")
              if ($data.Count -ne $expectedDataNames.Count -or
                  (($data.Name | Sort-Object) -join "|") -cne (($expectedDataNames | Sort-Object) -join "|") -or
                  @($data | Where-Object {
                    $_.Value.ValueKind -ne [Text.Json.JsonValueKind]::String -or
                    $_.Value.GetString() -cne "absent"
                  }).Count -ne 0) {
                throw "hard-kill capability evidence residue readback is invalid"
              }
            } finally {
              $json.Dispose()
            }
          }

          $artifactLedger = Join-Path $artifact "identity-ledger.json"
          $artifactEvidence = Join-Path $artifact "hard-kill-evidence.jsonl"
          if ((Test-Path -LiteralPath $artifactLedger) -or (Test-Path -LiteralPath $artifactEvidence)) {
            throw "hard-kill durable evidence baseline is not absent"
          }
          [IO.File]::WriteAllBytes($artifactLedger, [IO.File]::ReadAllBytes($ledgerPath))
          [IO.File]::WriteAllBytes($artifactEvidence, [IO.File]::ReadAllBytes($evidenceSource))
          $resultProperties = @(
            "schema", "status", "mode", "run_token", "identity_sha256", "candidate_sha",
            "client_sha256", "server_sha256", "controller_sha256", "guest_build", "cases",
            "process_absent", "adapter_absent", "addresses_absent", "routes_absent", "dns_absent",
            "inner_cleanup", "evidence_sha256", "stdout_sha256", "stderr_sha256", "finished_utc"
          )
          $result = [ordered]@{
            schema = "ferrum2.windows-tun.hard-kill-result.v1"
            status = "pass"
            mode = "hard-kill"
            run_token = $env:FERRUM2_TUN_RUN_TOKEN
            identity_sha256 = $ledgerHash
            candidate_sha = [string]$ledger.candidate_sha
            client_sha256 = $clientHash
            server_sha256 = $serverHash
            controller_sha256 = $controllerHash
            guest_build = [string]$ledger.guest_build
            cases = [long]3
            process_absent = $true
            adapter_absent = $true
            addresses_absent = $true
            routes_absent = $true
            dns_absent = $true
            inner_cleanup = "pass"
            evidence_sha256 = (Get-FileHash -LiteralPath $artifactEvidence -Algorithm SHA256).Hash.ToLowerInvariant()
            stdout_sha256 = (Get-FileHash -LiteralPath $stdoutPath -Algorithm SHA256).Hash.ToLowerInvariant()
            stderr_sha256 = (Get-FileHash -LiteralPath $stderrPath -Algorithm SHA256).Hash.ToLowerInvariant()
            finished_utc = [DateTime]::UtcNow.ToString("o")
          }
          $resultPath = Join-Path $artifact "hard-kill-result.json"
          $resultBytes = [Text.UTF8Encoding]::new($false).GetBytes(($result | ConvertTo-Json -Depth 4) + "`n")
          $resultStream = [IO.FileStream]::new($resultPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
          try { $resultStream.Write($resultBytes, 0, $resultBytes.Length); $resultStream.Flush($true) }
          finally { $resultStream.Dispose() }
          $readback = Get-Content -LiteralPath $resultPath -Raw -Encoding utf8 | ConvertFrom-Json -Depth 4
          if ((@($readback.PSObject.Properties.Name) -join "|") -cne ($resultProperties -join "|") -or
              $readback.schema -cne "ferrum2.windows-tun.hard-kill-result.v1" -or
              $readback.status -cne "pass" -or $readback.mode -cne "hard-kill" -or
              $readback.run_token -cne $env:FERRUM2_TUN_RUN_TOKEN -or
              $readback.identity_sha256 -cne $ledgerHash -or $readback.cases -isnot [long] -or
              $readback.cases -ne 3 -or $readback.inner_cleanup -cne "pass" -or
              @("process_absent", "adapter_absent", "addresses_absent", "routes_absent", "dns_absent" | Where-Object {
                $readback.$_ -isnot [bool] -or -not $readback.$_
              }).Count -ne 0) {
            throw "hard-kill durable result readback is invalid"
          }
      - name: Reap guest-only controller state
        if: ${{ always() }}
        shell: pwsh
        timeout-minutes: 30
        env:
          FERRUM2_TUN_QUALIFICATION_OUTCOME: ${{ steps.guest_qualification.outcome }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:FERRUM2_TUN_PROFILE -ceq "hard-kill") {
            $artifact = Join-Path $env:RUNNER_TEMP "ferrum2-hard-kill-$env:FERRUM2_TUN_RUN_TOKEN"
            if (-not (Test-Path -LiteralPath $artifact)) {
              New-Item -ItemType Directory -Path $artifact | Out-Null
            }
            if (-not (Test-Path -LiteralPath $artifact -PathType Container) -or
                ((Get-Item -LiteralPath $artifact -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
              throw "hard-kill artifact directory boundary is invalid"
            }

            function Invoke-CapturedPwsh(
              [string[]]$Arguments,
              [string]$StdoutPath,
              [string]$StderrPath
            ) {
              if ((Test-Path -LiteralPath $StdoutPath) -or (Test-Path -LiteralPath $StderrPath)) {
                throw "hard-kill cleanup log baseline is not absent"
              }
              $start = [Diagnostics.ProcessStartInfo]::new()
              $start.FileName = (Get-Command pwsh -ErrorAction Stop).Source
              $start.UseShellExecute = $false
              $start.CreateNoWindow = $true
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              foreach ($argument in $Arguments) { $start.ArgumentList.Add($argument) }
              $process = [Diagnostics.Process]::new()
              $process.StartInfo = $start
              [void]$process.Start()
              $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              $stderrTask = $process.StandardError.ReadToEndAsync()
              $process.WaitForExit()
              $stdout = $stdoutTask.GetAwaiter().GetResult()
              $stderr = $stderrTask.GetAwaiter().GetResult()
              [IO.File]::WriteAllText($StdoutPath, $stdout, [Text.UTF8Encoding]::new($false))
              [IO.File]::WriteAllText($StderrPath, $stderr, [Text.UTF8Encoding]::new($false))
              if ($stdout.Length -ne 0) { [Console]::Out.Write($stdout) }
              if ($stderr.Length -ne 0) { [Console]::Error.Write($stderr) }
              $exitCode = $process.ExitCode
              $process.Dispose()
              return $exitCode
            }

            $cleanupStdoutPath = Join-Path $artifact "cleanup.stdout.log"
            $cleanupStderrPath = Join-Path $artifact "cleanup.stderr.log"
            $cleanupArguments = @(
              "-NoProfile", "-File", "tests/platform/qualify_windows_tun.ps1",
              "-Mode", "cleanup",
              "-RunToken", $env:FERRUM2_TUN_RUN_TOKEN
            )
            $cleanupExit = Invoke-CapturedPwsh $cleanupArguments $cleanupStdoutPath $cleanupStderrPath

            $artifactLedger = Join-Path $artifact "identity-ledger.json"
            if (-not [string]::IsNullOrWhiteSpace($env:FERRUM2_TUN_IDENTITY_LEDGER) -and
                (Test-Path -LiteralPath $env:FERRUM2_TUN_IDENTITY_LEDGER -PathType Leaf)) {
              $ledgerSource = (Resolve-Path -LiteralPath $env:FERRUM2_TUN_IDENTITY_LEDGER).Path
              if ((Get-Item -LiteralPath $ledgerSource -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "hard-kill supplied ledger must not be a reparse point"
              }
              if (-not (Test-Path -LiteralPath $artifactLedger)) {
                [IO.File]::WriteAllBytes($artifactLedger, [IO.File]::ReadAllBytes($ledgerSource))
              } else {
                if ((Get-Item -LiteralPath $artifactLedger -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                  throw "hard-kill artifact ledger must not be a reparse point"
                }
                if ((Get-FileHash -LiteralPath $artifactLedger -Algorithm SHA256).Hash -cne
                    (Get-FileHash -LiteralPath $ledgerSource -Algorithm SHA256).Hash) {
                  throw "hard-kill artifact ledger differs from the supplied ledger"
                }
              }
              $evidenceSource = "$ledgerSource.evidence-$env:FERRUM2_TUN_RUN_TOKEN.jsonl"
              $artifactEvidence = Join-Path $artifact "hard-kill-evidence.jsonl"
              if (Test-Path -LiteralPath $evidenceSource -PathType Leaf) {
                $evidenceItem = Get-Item -LiteralPath $evidenceSource -Force
                if ($evidenceItem.Length -gt 1048576 -or
                    ($evidenceItem.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw "hard-kill controller evidence boundary is invalid"
                }
                if (-not (Test-Path -LiteralPath $artifactEvidence)) {
                  [IO.File]::WriteAllBytes($artifactEvidence, [IO.File]::ReadAllBytes($evidenceSource))
                } else {
                  if ((Get-Item -LiteralPath $artifactEvidence -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) {
                    throw "hard-kill artifact evidence must not be a reparse point"
                  }
                  if ((Get-FileHash -LiteralPath $artifactEvidence -Algorithm SHA256).Hash -cne
                      (Get-FileHash -LiteralPath $evidenceSource -Algorithm SHA256).Hash) {
                    throw "hard-kill artifact evidence differs from the controller evidence"
                  }
                }
              }
            }
            if ($cleanupExit -ne 0) { throw "hard-kill guest cleanup failed with exit code $cleanupExit" }

            $workPaths = @(
              Join-Path ([IO.Path]::GetTempPath()) "ferrum2-m15-tun-$env:FERRUM2_TUN_RUN_TOKEN"
              Join-Path ([IO.Path]::GetTempPath()) "ferrum2-m16-network-$env:FERRUM2_TUN_RUN_TOKEN"
              Join-Path ([IO.Path]::GetTempPath()) "ferrum2-m16-product-$env:FERRUM2_TUN_RUN_TOKEN"
              Join-Path ([IO.Path]::GetTempPath()) "ferrum2-m17-tun-$env:FERRUM2_TUN_RUN_TOKEN"
            ) | ForEach-Object { [IO.Path]::GetFullPath($_).TrimEnd('\', '/') }
            $adapterNames = @(
              "Ferrum2-M15-$env:FERRUM2_TUN_RUN_TOKEN",
              "Ferrum2-M16-$env:FERRUM2_TUN_RUN_TOKEN",
              "F2-M16P-A-$env:FERRUM2_TUN_RUN_TOKEN",
              "F2-M16P-M-$env:FERRUM2_TUN_RUN_TOKEN",
              "F2-M17-$env:FERRUM2_TUN_RUN_TOKEN"
            )
            $clientPath = [IO.Path]::GetFullPath("target/debug/ferrum2-client.exe")
            $serverPath = [IO.Path]::GetFullPath("target/debug/ferrum2-server.exe")
            $executables = @($clientPath, $serverPath)
            $processResidue = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
              $row = $_
              $executableMatches = @($executables | Where-Object {
                [string]::Equals([string]$row.ExecutablePath, $_, [StringComparison]::OrdinalIgnoreCase)
              }).Count -eq 1
              $workMatches = @($workPaths | Where-Object {
                $prefix = $_ + [IO.Path]::DirectorySeparatorChar
                $row.CommandLine -and
                  $row.CommandLine.IndexOf($prefix, [StringComparison]::OrdinalIgnoreCase) -ge 0
              }).Count -ge 1
              $executableMatches -and $row.CommandLine -and
                $row.CommandLine.IndexOf("--config", [StringComparison]::Ordinal) -ge 0 -and $workMatches
            }).Count
            $adapterResidue = @($adapterNames | ForEach-Object {
              $expectedName = $_
              Get-NetAdapter -Name $expectedName -IncludeHidden -ErrorAction SilentlyContinue |
                Where-Object { [string]::Equals($_.Name, $expectedName, [StringComparison]::OrdinalIgnoreCase) }
            }).Count
            $targetAddresses = @(
              "192.0.2.201", "2001:db8::202", "192.0.2.203", "2001:db8::204",
              "192.0.2.205", "2001:db8::206", "192.0.2.207", "2001:db8::208",
              "192.0.2.250", "192.0.2.241", "192.0.2.242", "2001:db8::241"
            )
            $addressResidue = @($targetAddresses | Where-Object {
              @(Get-NetIPAddress -InterfaceIndex 1 -IPAddress $_ -ErrorAction SilentlyContinue).Count -ne 0
            }).Count
            $routeResidue = @($targetAddresses | Where-Object {
              $prefix = if ($_.Contains(":")) { "$_/128" } else { "$_/32" }
              @(Get-NetRoute -InterfaceIndex 1 -DestinationPrefix $prefix -PolicyStore ActiveStore -ErrorAction SilentlyContinue).Count -ne 0
            }).Count
            $dnsResidue = @($adapterNames | ForEach-Object {
              $expectedName = $_
              Get-DnsClientServerAddress -InterfaceAlias $expectedName -ErrorAction SilentlyContinue |
                Where-Object { [string]::Equals($_.InterfaceAlias, $expectedName, [StringComparison]::OrdinalIgnoreCase) }
            }).Count
            $siblingResidue = if (Test-Path -LiteralPath (Join-Path (Split-Path -Parent $clientPath) "wintun.dll")) { 1 } else { 0 }
            $workResidue = @($workPaths | Where-Object { Test-Path -LiteralPath $_ }).Count
            $mutationResidue = @($workPaths | Where-Object {
              Test-Path -LiteralPath (Join-Path $_ "m17-network-mutations")
            }).Count
            $firewallResidue = @(Get-NetFirewallRule -Name "Ferrum2-M17-UDP-$env:FERRUM2_TUN_RUN_TOKEN" -PolicyStore ActiveStore -ErrorAction SilentlyContinue).Count
            $journalRoot = Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData)) "Ferrum2\ControllerRunIdentities"
            $journalPath = Join-Path $journalRoot "$env:FERRUM2_TUN_RUN_TOKEN.json"
            $identityJournalResidue = @(@($journalPath, "$journalPath.pending") | Where-Object {
              Test-Path -LiteralPath $_
            }).Count
            $residue = @(
              $processResidue, $adapterResidue, $addressResidue, $routeResidue, $dnsResidue,
              $siblingResidue, $workResidue, $mutationResidue, $firewallResidue, $identityJournalResidue
            )
            if (@($residue | Where-Object { $_ -ne 0 }).Count -ne 0) {
              throw "hard-kill external cleanup readback found residue"
            }

            $identityHash = ""
            if (Test-Path -LiteralPath $artifactLedger -PathType Leaf) {
              $ledgerItem = Get-Item -LiteralPath $artifactLedger -Force
              if ($ledgerItem.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "hard-kill artifact ledger must not be a reparse point"
              }
              $identityHash = (Get-FileHash -LiteralPath $artifactLedger -Algorithm SHA256).Hash.ToLowerInvariant()
              if (-not [string]::IsNullOrWhiteSpace($env:FERRUM2_TUN_IDENTITY_SHA256) -and
                  $identityHash -cne $env:FERRUM2_TUN_IDENTITY_SHA256) {
                throw "hard-kill cleanup identity hash changed"
              }
            }

            if ($env:FERRUM2_TUN_QUALIFICATION_OUTCOME -ceq "success") {
              if ([string]::IsNullOrWhiteSpace($identityHash) -or
                  $identityHash -cne $env:FERRUM2_TUN_IDENTITY_SHA256) {
                throw "successful hard-kill run lacks its exact identity ledger"
              }
              $resultPath = Join-Path $artifact "hard-kill-result.json"
              $evidencePath = Join-Path $artifact "hard-kill-evidence.jsonl"
              $stdoutPath = Join-Path $artifact "controller.stdout.log"
              $stderrPath = Join-Path $artifact "controller.stderr.log"
              foreach ($requiredPath in @($resultPath, $evidencePath, $stdoutPath, $stderrPath)) {
                if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf) -or
                    ((Get-Item -LiteralPath $requiredPath -Force).Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw "successful hard-kill artifact is missing or unsafe: $requiredPath"
                }
              }
              if ((Get-Item -LiteralPath $resultPath).Length -le 0 -or
                  (Get-Item -LiteralPath $resultPath).Length -gt 1048576 -or
                  (Get-Item -LiteralPath $evidencePath).Length -le 0 -or
                  (Get-Item -LiteralPath $evidencePath).Length -gt 1048576) {
                throw "successful hard-kill JSON evidence boundary is invalid"
              }
              $evidenceLines = @(Get-Content -LiteralPath $evidencePath -Encoding utf8)
              $expectedPhases = @("hard-kill-auto-route", "hard-kill-auto-dns", "hard-kill-mixed")
              if ($evidenceLines.Count -ne $expectedPhases.Count) {
                throw "hard-kill artifact evidence row count is invalid"
              }
              for ($index = 0; $index -lt $expectedPhases.Count; $index++) {
                $evidenceJson = [Text.Json.JsonDocument]::Parse($evidenceLines[$index])
                try {
                  $evidenceProperties = @($evidenceJson.RootElement.EnumerateObject())
                  if (($evidenceProperties.Name -join "|") -cne "schema|phase|timestamp_utc|data" -or
                      $evidenceProperties[0].Value.ValueKind -ne [Text.Json.JsonValueKind]::Number -or
                      $evidenceProperties[0].Value.GetInt64() -ne 1 -or
                      $evidenceProperties[1].Value.ValueKind -ne [Text.Json.JsonValueKind]::String -or
                      $evidenceProperties[1].Value.GetString() -cne $expectedPhases[$index] -or
                      $evidenceProperties[2].Value.ValueKind -ne [Text.Json.JsonValueKind]::String -or
                      $evidenceProperties[3].Value.ValueKind -ne [Text.Json.JsonValueKind]::Object) {
                    throw "hard-kill artifact evidence identity is invalid"
                  }
                  [DateTimeOffset]$evidenceTimestamp = [DateTimeOffset]::MinValue
                  if (-not [DateTimeOffset]::TryParseExact(
                      $evidenceProperties[2].Value.GetString(), "o", [Globalization.CultureInfo]::InvariantCulture,
                      [Globalization.DateTimeStyles]::RoundtripKind, [ref]$evidenceTimestamp
                    ) -or $evidenceTimestamp.Offset -ne [TimeSpan]::Zero) {
                    throw "hard-kill artifact evidence timestamp is invalid"
                  }
                  $evidenceData = @($evidenceProperties[3].Value.EnumerateObject())
                  $expectedDataNames = @("process", "adapter", "addresses", "routes", "dns")
                  if ($evidenceData.Count -ne $expectedDataNames.Count -or
                      (($evidenceData.Name | Sort-Object) -join "|") -cne (($expectedDataNames | Sort-Object) -join "|") -or
                      @($evidenceData | Where-Object {
                        $_.Value.ValueKind -ne [Text.Json.JsonValueKind]::String -or
                        $_.Value.GetString() -cne "absent"
                      }).Count -ne 0) {
                    throw "hard-kill artifact evidence residue readback is invalid"
                  }
                } finally {
                  $evidenceJson.Dispose()
                }
              }
              $ledger = Get-Content -LiteralPath $artifactLedger -Raw -Encoding utf8 | ConvertFrom-Json -Depth 4
              $resultRaw = Get-Content -LiteralPath $resultPath -Raw -Encoding utf8
              $resultJson = [Text.Json.JsonDocument]::Parse($resultRaw)
              try {
                $resultProperties = @($resultJson.RootElement.EnumerateObject())
                $expectedResultProperties = @(
                  "schema", "status", "mode", "run_token", "identity_sha256", "candidate_sha",
                  "client_sha256", "server_sha256", "controller_sha256", "guest_build", "cases",
                  "process_absent", "adapter_absent", "addresses_absent", "routes_absent", "dns_absent",
                  "inner_cleanup", "evidence_sha256", "stdout_sha256", "stderr_sha256", "finished_utc"
                )
                if (($resultProperties.Name -join "|") -cne ($expectedResultProperties -join "|")) {
                  throw "hard-kill result property set or order is invalid"
                }
                foreach ($name in @(
                  "schema", "status", "mode", "run_token", "identity_sha256", "candidate_sha",
                  "client_sha256", "server_sha256", "controller_sha256", "guest_build", "inner_cleanup",
                  "evidence_sha256", "stdout_sha256", "stderr_sha256", "finished_utc"
                )) {
                  if ($resultJson.RootElement.GetProperty($name).ValueKind -ne [Text.Json.JsonValueKind]::String) {
                    throw "hard-kill result property is not a JSON string: $name"
                  }
                }
                if ($resultJson.RootElement.GetProperty("cases").ValueKind -ne [Text.Json.JsonValueKind]::Number -or
                    $resultJson.RootElement.GetProperty("cases").GetInt64() -ne 3) {
                  throw "hard-kill result case count is invalid"
                }
                foreach ($name in @("process_absent", "adapter_absent", "addresses_absent", "routes_absent", "dns_absent")) {
                  if ($resultJson.RootElement.GetProperty($name).ValueKind -notin @(
                      [Text.Json.JsonValueKind]::True, [Text.Json.JsonValueKind]::False
                    ) -or -not $resultJson.RootElement.GetProperty($name).GetBoolean()) {
                    throw "hard-kill result absence property is invalid: $name"
                  }
                }
                $stringValues = [ordered]@{}
                foreach ($name in @(
                  "schema", "status", "mode", "run_token", "identity_sha256", "candidate_sha",
                  "client_sha256", "server_sha256", "controller_sha256", "guest_build", "inner_cleanup",
                  "evidence_sha256", "stdout_sha256", "stderr_sha256", "finished_utc"
                )) {
                  $stringValues[$name] = $resultJson.RootElement.GetProperty($name).GetString()
                }
              } finally {
                $resultJson.Dispose()
              }
              [DateTimeOffset]$resultFinished = [DateTimeOffset]::MinValue
              $resultFinishedValid = [DateTimeOffset]::TryParseExact(
                $stringValues.finished_utc, "o", [Globalization.CultureInfo]::InvariantCulture,
                [Globalization.DateTimeStyles]::RoundtripKind, [ref]$resultFinished
              ) -and $resultFinished.Offset -eq [TimeSpan]::Zero
              $expectedMarker = "m16_windows_hard_kill status=PASS cases=3/3 process_absent=PASS adapter=ABSENT addresses=ABSENT routes=ABSENT dns=ABSENT cleanup=PASS guest_build=$($ledger.guest_build) run_token=$env:FERRUM2_TUN_RUN_TOKEN candidate_sha=$($ledger.candidate_sha) probe_sha256=$($ledger.probe_sha256) identity_sha256=$identityHash"
              $stdoutLines = @(Get-Content -LiteralPath $stdoutPath -Encoding utf8)
              $markerCount = @($stdoutLines | Where-Object { $_ -ceq $expectedMarker }).Count
              $terminalLineCount = @($stdoutLines | Where-Object {
                $_.StartsWith("m16_windows_hard_kill ", [StringComparison]::Ordinal)
              }).Count
              $nonemptyStdout = @($stdoutLines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
              $clientHash = (Get-FileHash -LiteralPath $clientPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $serverHash = (Get-FileHash -LiteralPath $serverPath -Algorithm SHA256).Hash.ToLowerInvariant()
              $controllerHash = (Get-FileHash -LiteralPath "tests/platform/qualify_windows_tun.ps1" -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($stringValues.schema -cne "ferrum2.windows-tun.hard-kill-result.v1" -or
                  $stringValues.status -cne "pass" -or $stringValues.mode -cne "hard-kill" -or
                  $stringValues.run_token -cne $env:FERRUM2_TUN_RUN_TOKEN -or
                  $stringValues.identity_sha256 -cne $identityHash -or
                  $stringValues.candidate_sha -cne $env:GITHUB_SHA.ToLowerInvariant() -or
                  $stringValues.candidate_sha -cne [string]$ledger.candidate_sha -or
                  $stringValues.client_sha256 -cne $clientHash -or
                  $stringValues.server_sha256 -cne $serverHash -or
                  $stringValues.controller_sha256 -cne $controllerHash -or
                  $stringValues.controller_sha256 -cne [string]$ledger.probe_sha256 -or
                  $stringValues.guest_build -cne [string]$ledger.guest_build -or
                  $stringValues.inner_cleanup -cne "pass" -or
                  $stringValues.evidence_sha256 -cne (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant() -or
                  $stringValues.stdout_sha256 -cne (Get-FileHash -LiteralPath $stdoutPath -Algorithm SHA256).Hash.ToLowerInvariant() -or
                  $stringValues.stderr_sha256 -cne (Get-FileHash -LiteralPath $stderrPath -Algorithm SHA256).Hash.ToLowerInvariant() -or
                  -not $resultFinishedValid -or $markerCount -ne 1 -or $terminalLineCount -ne 1 -or
                  $nonemptyStdout.Count -eq 0 -or $nonemptyStdout[-1] -cne $expectedMarker) {
                throw "hard-kill durable success evidence readback is invalid"
              }
            }

            $cleanupProperties = @(
              "schema", "status", "source_mode", "run_token", "identity_sha256",
              "qualification_outcome", "processes", "adapters", "target_addresses", "target_routes",
              "dns_rows", "sibling_dll", "work_directories", "mutation_journals", "firewall_rules",
              "identity_journal", "finished_utc"
            )
            $cleanup = [ordered]@{
              schema = "ferrum2.windows-tun.hard-kill-cleanup.v1"
              status = "pass"
              source_mode = "hard-kill"
              run_token = $env:FERRUM2_TUN_RUN_TOKEN
              identity_sha256 = $identityHash
              qualification_outcome = [string]$env:FERRUM2_TUN_QUALIFICATION_OUTCOME
              processes = [long]$processResidue
              adapters = [long]$adapterResidue
              target_addresses = [long]$addressResidue
              target_routes = [long]$routeResidue
              dns_rows = [long]$dnsResidue
              sibling_dll = [long]$siblingResidue
              work_directories = [long]$workResidue
              mutation_journals = [long]$mutationResidue
              firewall_rules = [long]$firewallResidue
              identity_journal = [long]$identityJournalResidue
              finished_utc = [DateTime]::UtcNow.ToString("o")
            }
            $cleanupPath = Join-Path $artifact "hard-kill-cleanup.json"
            $cleanupBytes = [Text.UTF8Encoding]::new($false).GetBytes(($cleanup | ConvertTo-Json -Depth 4) + "`n")
            $cleanupStream = [IO.FileStream]::new($cleanupPath, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try { $cleanupStream.Write($cleanupBytes, 0, $cleanupBytes.Length); $cleanupStream.Flush($true) }
            finally { $cleanupStream.Dispose() }
            $cleanupRaw = Get-Content -LiteralPath $cleanupPath -Raw -Encoding utf8
            $cleanupReadback = $cleanupRaw | ConvertFrom-Json -Depth 4
            $cleanupJson = [Text.Json.JsonDocument]::Parse($cleanupRaw)
            try {
              $jsonProperties = @($cleanupJson.RootElement.EnumerateObject())
              if (($jsonProperties.Name -join "|") -cne ($cleanupProperties -join "|")) {
                throw "hard-kill cleanup property set or order is invalid"
              }
              foreach ($name in @(
                "schema", "status", "source_mode", "run_token", "identity_sha256",
                "qualification_outcome", "finished_utc"
              )) {
                if ($cleanupJson.RootElement.GetProperty($name).ValueKind -ne [Text.Json.JsonValueKind]::String) {
                  throw "hard-kill cleanup property is not a JSON string: $name"
                }
              }
              foreach ($name in $cleanupProperties[6..15]) {
                if ($cleanupJson.RootElement.GetProperty($name).ValueKind -ne [Text.Json.JsonValueKind]::Number -or
                    $cleanupJson.RootElement.GetProperty($name).GetInt64() -ne 0) {
                  throw "hard-kill cleanup residue property is invalid: $name"
                }
              }
            } finally {
              $cleanupJson.Dispose()
            }
            [DateTimeOffset]$cleanupFinished = [DateTimeOffset]::MinValue
            $cleanupFinishedValid = [DateTimeOffset]::TryParseExact(
              [string]$cleanupReadback.finished_utc, "o", [Globalization.CultureInfo]::InvariantCulture,
              [Globalization.DateTimeStyles]::RoundtripKind, [ref]$cleanupFinished
            ) -and $cleanupFinished.Offset -eq [TimeSpan]::Zero
            if ($cleanupReadback.schema -cne "ferrum2.windows-tun.hard-kill-cleanup.v1" -or
                $cleanupReadback.status -cne "pass" -or $cleanupReadback.source_mode -cne "hard-kill" -or
                $cleanupReadback.run_token -cne $env:FERRUM2_TUN_RUN_TOKEN -or
                $cleanupReadback.identity_sha256 -cne $identityHash -or
                $cleanupReadback.qualification_outcome -cne $env:FERRUM2_TUN_QUALIFICATION_OUTCOME -or
                -not $cleanupFinishedValid -or
                @($cleanupProperties[6..15] | Where-Object {
                  $cleanupReadback.$_ -isnot [long] -or $cleanupReadback.$_ -ne 0
                }).Count -ne 0) {
              throw "hard-kill cleanup durable readback is invalid"
            }
            if ($env:FERRUM2_TUN_QUALIFICATION_OUTCOME -ceq "success") {
              $expectedArtifactFiles = @(
                "identity-ledger.json", "controller.stdout.log", "controller.stderr.log",
                "hard-kill-evidence.jsonl", "hard-kill-result.json", "cleanup.stdout.log",
                "cleanup.stderr.log", "hard-kill-cleanup.json"
              )
              $artifactItems = @(Get-ChildItem -LiteralPath $artifact -Force -ErrorAction Stop)
              if ($artifactItems.Count -ne $expectedArtifactFiles.Count -or
                  (($artifactItems.Name | Sort-Object) -join "|") -cne (($expectedArtifactFiles | Sort-Object) -join "|") -or
                  @($artifactItems | Where-Object {
                    $_.PSIsContainer -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint)
                  }).Count -ne 0) {
                throw "successful hard-kill artifact file set is not closed"
              }
            }
            return
          }

          $artifact = Join-Path $env:RUNNER_TEMP "ferrum2-m17-$env:FERRUM2_TUN_RUN_TOKEN"
          & pwsh -NoProfile -File tests/platform/qualify_windows_tun.ps1 `
            -Mode cleanup `
            -RunToken $env:FERRUM2_TUN_RUN_TOKEN `
            -ArtifactDirectory $artifact
          if ($LASTEXITCODE -ne 0) { throw "guest cleanup failed" }
          $cleanupPath = Join-Path $artifact "external-cleanup.json"
          if (-not (Test-Path -LiteralPath $cleanupPath -PathType Leaf)) {
            throw "external cleanup readback is missing"
          }
          $cleanupRaw = Get-Content -LiteralPath $cleanupPath -Raw -Encoding utf8
          $cleanup = $cleanupRaw | ConvertFrom-Json -Depth 4
          $expectedProperties = @(
            "schema", "status", "run_token", "source_mode", "identity_sha256", "processes", "adapters",
            "target_addresses", "target_routes", "sibling_dll", "work_directories", "mutation_journals",
            "identity_journal", "finished_utc"
          )
          $expectedMode = $env:FERRUM2_TUN_PROFILE
          if ($expectedMode -match '^restart-(10|100|1000)$') { $expectedMode = "restart-stress" }
          $ledgerHash = (Get-FileHash -LiteralPath (Join-Path $artifact "identity-ledger.json") -Algorithm SHA256).Hash.ToLowerInvariant()
          $cleanupJson = [Text.Json.JsonDocument]::Parse($cleanupRaw)
          try {
            $cleanupProperties = @($cleanupJson.RootElement.EnumerateObject())
            $cleanupStrings = [ordered]@{}
            foreach ($name in @("schema", "status", "run_token", "source_mode", "identity_sha256", "finished_utc")) {
              $matches = @($cleanupProperties | Where-Object { $_.Name -ceq $name })
              if ($matches.Count -ne 1 -or $matches[0].Value.ValueKind -ne [Text.Json.JsonValueKind]::String) {
                throw "external cleanup property is not one unique JSON string: $name"
              }
              $cleanupStrings[$name] = $matches[0].Value.GetString()
            }
          } finally {
            $cleanupJson.Dispose()
          }
          [DateTimeOffset]$finishedUtc = [DateTimeOffset]::MinValue
          $finishedUtcValid =
            [DateTimeOffset]::TryParseExact(
              $cleanupStrings.finished_utc,
              "o",
              [Globalization.CultureInfo]::InvariantCulture,
              [Globalization.DateTimeStyles]::RoundtripKind,
              [ref]$finishedUtc
            ) -and $finishedUtc.Offset -eq [TimeSpan]::Zero
          if ($cleanup.schema -isnot [string] -or $cleanup.status -isnot [string] -or
              $cleanup.run_token -isnot [string] -or $cleanup.source_mode -isnot [string] -or
              $cleanup.identity_sha256 -isnot [string] -or -not $finishedUtcValid -or
              $cleanup.schema -cne "ferrum2.windows-tun.m17-external-cleanup.v1" -or
              $cleanup.status -cne "pass" -or $cleanup.run_token -cne $env:FERRUM2_TUN_RUN_TOKEN -or
              $cleanup.source_mode -cne $expectedMode -or $cleanup.identity_sha256 -cne $ledgerHash -or
              (@($cleanup.PSObject.Properties.Name) -join "|") -cne ($expectedProperties -join "|") -or
              @($expectedProperties[5..12] | Where-Object {
                $value = $cleanup.$_
                -not ($value -is [long] -and $value -eq 0)
              }).Count -ne 0) {
            throw "external cleanup readback is invalid"
          }
      - name: Upload M17 guest contract and logs
        if: ${{ always() && inputs.windows_tun_profile != 'hard-kill' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: windows-tun-lifecycle-${{ inputs.windows_tun_profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\ferrum2-m17-${{ github.run_id }}-${{ github.run_attempt }}-lifecycle
          if-no-files-found: error
          retention-days: 30
      - name: Upload hard-kill guest contract and logs
        if: ${{ always() && inputs.windows_tun_profile == 'hard-kill' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 10
        with:
          name: windows-tun-lifecycle-${{ inputs.windows_tun_profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\ferrum2-hard-kill-${{ github.run_id }}-${{ github.run_attempt }}-lifecycle
          if-no-files-found: error
          retention-days: 30
