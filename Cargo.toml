[workspace]
members = [
    "bins/ferrum2-client",
    "bins/ferrum2-server",
    "crates/ferrum2-core",
    "crates/ferrum2-rule",
    "crates/ferrum2-ruleset",
    "crates/ferrum2-crypto",
    "crates/ferrum2-shadowsocks",
    "crates/ferrum2-socks5",
    "crates/ferrum2-net",
    "crates/ferrum2-runtime",
    "crates/ferrum2-structural",
    "crates/ferrum2-config",
    "crates/ferrum2-dns",
    "crates/ferrum2-observability",
    "crates/ferrum2-sniff",
    "crates/ferrum2-tun",
    "crates/ferrum2-platform-windows",
    "tests/m0-harness",
    "tools/ferrum2-m4-qualification",
    "tools/ferrum2-rule-qualification",
]
exclude = ["vendor/shadowsocks-crypto"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
ferrum2-core = { path = "crates/ferrum2-core", version = "=0.1.0" }
ferrum2-rule = { path = "crates/ferrum2-rule", version = "=0.1.0" }
ferrum2-ruleset = { path = "crates/ferrum2-ruleset", version = "=0.1.0" }
ferrum2-crypto = { path = "crates/ferrum2-crypto", version = "=0.1.0" }
ferrum2-shadowsocks = { path = "crates/ferrum2-shadowsocks", version = "=0.1.0" }
ferrum2-socks5 = { path = "crates/ferrum2-socks5", version = "=0.1.0" }
ferrum2-net = { path = "crates/ferrum2-net", version = "=0.1.0" }
ferrum2-runtime = { path = "crates/ferrum2-runtime", version = "=0.1.0" }
ferrum2-structural = { path = "crates/ferrum2-structural", version = "=0.1.0" }
ferrum2-config = { path = "crates/ferrum2-config", version = "=0.1.0" }
ferrum2-dns = { path = "crates/ferrum2-dns", version = "=0.1.0" }
ferrum2-observability = { path = "crates/ferrum2-observability", version = "=0.1.0" }
ferrum2-sniff = { path = "crates/ferrum2-sniff", version = "=0.1.0" }
ferrum2-tun = { path = "crates/ferrum2-tun", version = "=0.1.0", default-features = false }
ferrum2-platform-windows = { path = "crates/ferrum2-platform-windows", version = "=0.1.0", default-features = false }
shadowsocks-crypto = { version = "=0.7.0", default-features = false, features = ["v2"] }
hickory-resolver = { version = "=0.26.1", default-features = false, features = ["tokio", "tls-ring", "https-ring", "webpki-roots"] }
hickory-proto = { version = "=0.26.1", default-features = false, features = ["std"] }
hickory-server = { version = "=0.26.1", default-features = false }
ipnet = { version = "=2.12.1", default-features = false }
aho-corasick = "=1.1.4"
arc-swap = "=1.9.2"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.11.0", default-features = false }
stats_alloc = "=0.1.10"
url = { version = "=2.5.8", default-features = false, features = ["std"] }
h2 = { version = "=0.4.15", default-features = false, features = ["stream"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio", "http1"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["std"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["io"] }
webpki-roots = "=1.0.9"
httparse = { version = "=1.10.1", default-features = false }
smoltcp = { version = "=0.13.1", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-tcp-reno", "socket-udp", "iface-max-addr-count-2", "iface-max-route-count-2", "assembler-max-segment-count-4"] }

tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }
bytes = "=1.12.1"
socket2 = "=0.6.5"
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
toml = { version = "=1.1.3", default-features = false, features = ["std", "serde", "parse"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "env-filter"] }
prometheus-client = { version = "=0.25.0", default-features = false }
aes = { version = "=0.9.1", default-features = false, features = ["zeroize"] }
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "bytes", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["bytes", "zeroize"] }
blake3 = { version = "=1.8.5", default-features = false, features = ["std", "zeroize"] }
base64 = { version = "=0.23.0", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
clap = { version = "=4.6.4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
thiserror = "=2.0.19"

hex = "=0.4.3"
serde_json = "=1.0.151"
tempfile = "=3.27.0"
proc-macro2 = { version = "=1.0.107", default-features = false }

[patch.crates-io]
shadowsocks-crypto = { path = "vendor/shadowsocks-crypto" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.performance-thin-lto]
inherits = "profiling"
lto = "thin"
codegen-units = 1

[profile.performance-panic-abort-strip]
inherits = "profiling"
panic = "abort"
strip = "symbols"
