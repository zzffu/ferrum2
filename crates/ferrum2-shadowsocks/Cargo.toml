[package]
name = "ferrum2-shadowsocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
__frame-size-16k = []
__frame-size-65535 = []
__frame-size-adaptive = []
__single-worker-direct-open-diagnostic = []
candidate-udp-owned-headroom = []
structural-metrics = ["dep:ferrum2-structural"]
tokio = ["dep:tokio", "dep:tokio-util"]

[dependencies]
ferrum2-core.workspace = true
ferrum2-crypto.workspace = true
ferrum2-structural = { workspace = true, optional = true }
bytes.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true
