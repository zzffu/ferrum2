[package]
name = "ferrum2-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
candidate-udp-owned-headroom = ["dep:zeroize"]
structural-metrics = ["dep:ferrum2-structural"]

[dependencies]
ferrum2-core.workspace = true
ferrum2-net.workspace = true
ferrum2-structural = { workspace = true, optional = true }
bytes.workspace = true
futures-util.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
