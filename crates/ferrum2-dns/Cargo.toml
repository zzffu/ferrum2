[package]
name = "ferrum2-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
__interop-test-root = ["dep:rustls"]

[dependencies]
bytes.workspace = true
ferrum2-core.workspace = true
ferrum2-net.workspace = true
ferrum2-rule.workspace = true
futures-util.workspace = true
hickory-proto.workspace = true
hickory-resolver.workspace = true
hickory-server.workspace = true
rustls = { workspace = true, optional = true }
tokio.workspace = true

[dev-dependencies]
h2.workspace = true
# Exact 0.26.1 server-only gate; `https-ring` also locks its optional resolver/system-config edge.
hickory-server = { workspace = true, features = ["__https"] }
rustls.workspace = true
stats_alloc.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true
