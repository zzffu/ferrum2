[workspace]
members = ["."]
resolver = "3"

[package]
name = "ferrum2-tun-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[features]
# Keep ordinary and Windows Cargo invocations free of sanitizer-linked targets.
# The bounded Linux fuzz job opts in explicitly with `--features libfuzzer`.
default = []
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
ferrum2-config = { path = "../../ferrum2-config", features = ["fuzzing"] }
ferrum2-wintun = { path = "../../ferrum2-wintun", features = ["fuzzing"] }
libfuzzer-sys = { version = "=0.4.12", optional = true }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "sync"] }

[[bin]]
name = "packet_reassembly"
path = "fuzz_targets/packet_reassembly.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "udp_reset_races"
path = "fuzz_targets/udp_reset_races.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "config_legacy_fields"
path = "fuzz_targets/config_legacy_fields.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "strict_route_rules"
path = "fuzz_targets/strict_route_rules.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[patch.crates-io]
shadowsocks-crypto = { path = "../../../vendor/shadowsocks-crypto" }
