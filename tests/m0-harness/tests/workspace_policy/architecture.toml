schema = 1

workspace_members = [
    "ferrum2-client",
    "ferrum2-server",
    "ferrum2-config",
    "ferrum2-core",
    "ferrum2-crypto",
    "ferrum2-dns",
    "ferrum2-m0-harness",
    "ferrum2-m4-qualification",
    "ferrum2-net",
    "ferrum2-observability",
    "ferrum2-rule",
    "ferrum2-rule-qualification",
    "ferrum2-ruleset",
    "ferrum2-runtime",
    "ferrum2-shadowsocks",
    "ferrum2-sniff",
    "ferrum2-socks5",
    "ferrum2-tun",
    "ferrum2-platform-windows",
]

[[internal_dependency_allowlists]]
package = "ferrum2-runtime"
allowed = ["ferrum2-core", "ferrum2-net"]

[[internal_dependency_allowlists]]
package = "ferrum2-platform-windows"
allowed = ["ferrum2-net"]

[[internal_dependency_allowlists]]
package = "ferrum2-ruleset"
allowed = ["ferrum2-core", "ferrum2-dns", "ferrum2-rule"]

[[internal_dependency_allowlists]]
package = "ferrum2-observability"
allowed = []

[unsafe_boundary]
allow_declarations = 2
legacy_file = "crates/ferrum2-platform-windows/src/windows.rs"
legacy_allowed = false
allowed_paths = [
    "crates/ferrum2-platform-windows/src/windows/live",
    "crates/ferrum2-platform-windows/src/windows/core/raw.rs",
]

[shared_dns_tls]
root = "tests/fixtures/dns-tls"
readme = "tests/fixtures/dns-tls/README.md"
consumer_source_roots = ["bins", "crates", "tests", "tools"]
forbidden_consumer_paths = ["crates/ferrum2-dns/tests/fixtures"]
consumers = [
    "crates/ferrum2-dns/src/resolver.rs",
    "crates/ferrum2-dns/src/runtime_owner/tests.rs",
    "crates/ferrum2-ruleset/tests/ruleset_https.rs",
    "tests/m0-harness/src/external_support/dns_case.rs",
]

[[shared_dns_tls.files]]
name = "m12-test-ca.der"
bytes = 389
sha256 = "9d663938e7f28c1404bb7d8e27b0930c303a990bdaf9f3c16a0e5fddcefccd2c"

[[shared_dns_tls.files]]
name = "m12-resolver-test.der"
bytes = 408
sha256 = "aca34e22c4ab2ba8f83d3670854192860e9bd379dec21e948efff05a7dc35796"

[[shared_dns_tls.files]]
name = "m12-resolver-test.pk8"
bytes = 138
sha256 = "5309a360915ca5b912e9b4597b573bc4d01bdf67776cc150e16d250893610f6c"

[[transitive_forbidden_edges]]
from = "ferrum2-server"
to = "ferrum2-tun"
enforced = true
milestone = "R0"

[[direct_forbidden_edges]]
from = "ferrum2-net"
to = "ferrum2-runtime"
enforced = true
milestone = "NET-01"

[[direct_forbidden_edges]]
from = "ferrum2-net"
to = "ferrum2-dns"
enforced = true
milestone = "NET-01"

[[direct_forbidden_edges]]
from = "ferrum2-net"
to = "ferrum2-rule"
enforced = true
milestone = "NET-01"

[[direct_forbidden_edges]]
from = "ferrum2-net"
to = "ferrum2-config"
enforced = true
milestone = "NET-01"

[[direct_forbidden_edges]]
from = "ferrum2-net"
to = "ferrum2-tun"
enforced = true
milestone = "NET-01"

[[direct_forbidden_edges]]
from = "ferrum2-net"
to = "ferrum2-platform-windows"
enforced = true
milestone = "NET-01"

[[direct_forbidden_edges]]
from = "ferrum2-runtime"
to = "ferrum2-dns"
enforced = true
milestone = "RT-04"

[[direct_forbidden_edges]]
from = "ferrum2-runtime"
to = "ferrum2-rule"
enforced = true
milestone = "RT-04"

[[direct_forbidden_edges]]
from = "ferrum2-runtime"
to = "ferrum2-config"
enforced = true
milestone = "RT-04"

[[direct_forbidden_edges]]
from = "ferrum2-runtime"
to = "ferrum2-tun"
enforced = true
milestone = "RT-04"

[[direct_forbidden_edges]]
from = "ferrum2-runtime"
to = "ferrum2-platform-windows"
enforced = true
milestone = "RT-04"

[fuzz_impact]
owner_paths = [
    ".gitattributes",
    ".cargo/config.toml",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "crates/ferrum2-config/Cargo.toml",
    "crates/ferrum2-config/src/**",
    "crates/ferrum2-core/Cargo.toml",
    "crates/ferrum2-core/src/**",
    "crates/ferrum2-crypto/Cargo.toml",
    "crates/ferrum2-crypto/src/**",
    "crates/ferrum2-net/Cargo.toml",
    "crates/ferrum2-net/src/**",
    "crates/ferrum2-rule/Cargo.toml",
    "crates/ferrum2-rule/src/**",
    "crates/ferrum2-runtime/Cargo.toml",
    "crates/ferrum2-runtime/src/**",
    "crates/ferrum2-platform-windows/Cargo.toml",
    "crates/ferrum2-platform-windows/src/**",
    "crates/ferrum2-tun/Cargo.toml",
    "crates/ferrum2-tun/src/**",
    "crates/ferrum2-tun/tests/fixtures/packets/**",
    "crates/ferrum2-tun/fuzz/**",
    "tools/ci/__init__.py",
    "tools/ci/git_changes.py",
    "tools/ci/fuzz_contract.py",
    ".github/workflows/tun-fuzz-deterministic.yml",
    "tests/m0-harness/tests/workspace_policy/architecture.toml",
    "vendor/shadowsocks-crypto/Cargo.toml",
    "vendor/shadowsocks-crypto/src/**",
]
documentation_exclusions = [
    { pattern = "crates/ferrum2-tun/fuzz/*.md", kind = "markdown" },
    { pattern = "crates/ferrum2-tun/fuzz/**/*.md", kind = "markdown" },
]

[ci_required]
main_workflow = ".github/workflows/m0.yml"
main_needs = ["changes", "quality", "platform", "interop"]
fuzz_workflow = ".github/workflows/tun-fuzz-deterministic.yml"
fuzz_needs = ["impact", "deterministic-build", "libfuzzer-build", "fuzz-campaign"]

[fuzz_campaign]
targets = [
    "packet_reassembly",
    "udp_reset_races",
    "config_legacy_fields",
    "strict_route_rules",
]
seconds_per_target = 900
total_seconds = 3600
