version = 1

[workflow]
base_branch = "master"
worktree_root = ".worktrees"
engineer_branch_prefix = "codex/ticket"
integration_branch_prefix = "codex/integration"
# M2 showed that an eight-writer frontier leaves no headroom for reviewers and
# integration work. Three writers still permit disjoint slices to drain in parallel.
max_parallel_engineers = 3
require_clean_base = true
auto_remove_worktrees = false
# Transient implementation/review state lives in the local runtime ledger. Commit
# coordination documents only for an accepted contract change or integrated batch.
checkpoint_policy = "integration"

[execution]
# drain: one execute invocation keeps scheduling dependency-ready waves until the
# milestone is ready to close or a real stop condition is reached.
# wave: execute exactly one frontier, useful for debugging or manual control.
strategy = "drain"

# 0 means no artificial wave cap. The no-progress guard still prevents loops.
max_waves_per_run = 0
# Legacy fallback for tickets without an explicit risk classification.
max_repair_attempts_per_ticket = 1
# Mechanical repairs (line endings, formatting, filter spelling) do not consume the
# substantive repair budget.
repair_budget = { low = 1, medium = 1, high = 1, critical = 1 }
non_counting_repair_classes = ["mechanical"]
continue_after_independent_failure = true
auto_close = false
no_progress_limit = 2

[state]
# Relative to `git rev-parse --git-common-dir`, so every worktree and a resumed
# Codex context sees the same local state without polluting product history.
path = "codex/milestone-workflow-state.json"

[agents.product_manager]
config = ".codex/agents/product-manager.toml"
name = "product_manager"
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[agents.architect]
config = ".codex/agents/architect.toml"
name = "architect"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[agents.engineer]
config = ".codex/agents/engineer.toml"
name = "engineer"
model = "gpt-5.6-sol"
reasoning_effort = "high"

[agents.qa]
config = ".codex/agents/qa.toml"
name = "qa"
model = "gpt-5.6-sol"
reasoning_effort = "medium"

[documents]
vision = "docs/vision.md"
gap_analysis = "docs/gap-analysis.md"
roadmap = "docs/roadmap.md"
ci_status = "docs/ci-status.md"
adr_dir = "docs/adr"
spec_dir = "docs/specs"
test_plan_dir = "docs/test-plans"
ticket_dir = "docs/tickets"
handoff_dir = "docs/handoffs"
review_debt = "docs/review-debt.md"
workflow_debt = "docs/workflow-debt.md"
context_audit_dir = "docs/context-audits"

# Keep these host-local and deterministic. True external interoperability executes
# only in hosted qualification. Its non-test binary stays Cargo-managed so these
# gates compile/lint it, but quick/full must never run its entry, download a
# reference, or spawn an external reference process. Security and local
# lifecycle/product behavior remain part of these Cargo gates.
[validation]
# Force UTF-8 for the workflow package on Windows. Standalone workflow.py commands
# should use the same `python -X utf8` launcher.
workflow = [
  "python -X utf8 -m unittest discover -s .agents/skills/milestone-workflow/tests -p test_*.py",
]
# The real-process suites resolve un-hashed binaries and the UDP protocol example
# from Cargo's target profile directory, so a clean gate must build them explicitly.
quick = [
  "cargo fmt --all -- --check",
  "cargo check --workspace --all-targets --locked",
  "cargo build --workspace --bins --locked",
  "cargo build -p ferrum2-shadowsocks --example udp_protocol_client --locked",
  "cargo test --workspace --locked",
]
# M2-INT-QA-001: run this full command list once and never concurrently in multiple
# worktrees; concurrent full gates produced a false lifecycle-witness timeout.
full = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings",
  "cargo build --workspace --bins --locked",
  "cargo build -p ferrum2-shadowsocks --example udp_protocol_client --locked",
  "cargo test --workspace --all-features --locked",
  "cargo doc --workspace --all-features --no-deps --locked",
]

[planning]
contract_style = "outcome"
max_adrs_per_milestone = 4
allow_new_adr_during_execute = false
spec_soft_line_limit = 400
test_plan_soft_line_limit = 300
max_acceptance_criteria_per_ticket = 8

[review]
blocking_severities = ["blocker", "major"]
max_full_review_rounds = 1
max_targeted_repair_rounds = 1
new_blockers_after_first_review = "introduced_by_repair_only"
pass_with_notes_integrates = true
freeze_contract_on_execute = true
write_advisories_to_backlog = true

[quality.test_budget]
enabled = true
tool = "builtin"
mode = "ratchet"
target_ratio = 1.0
warn_ratio = 0.85
max_regression = 0.0
ratchet_step = 0.05
max_delta_ratio = 1.0
delta_test_allowance = 120
min_code_lines = 200
baseline_path = "codex/test-budget-baseline.json"
include_extensions = [".rs"]
exclude_globs = [
  ".git/**",
  ".worktrees/**",
  "target/**",
  "**/target/**",
  "**/generated/**",
  "**/fixtures/**",
]

[control_plane]
managed_drift_policy = "block"
manifest_path = ".codex/milestone-workflow-install.json"
workflow_debt_path = "docs/workflow-debt.md"
protected_globs = [
  ".agents/skills/**",
  ".agents/AGENTS.override.md",
  ".codex/agents/**",
  ".codex/AGENTS.override.md",
  ".codex/config.toml",
  ".codex/milestone-workflow-install.json",
  "workflow.toml",
  "skills-lock.json",
]

[context]
agents_file = "AGENTS.md"
section_heading = "Project-specific context"
required_entries = [
  "Product purpose",
  "Primary languages/frameworks",
  "Architecture entry points",
  "Critical invariants",
  "Generated files",
  "Local development setup",
  "Active planned changes",
]
planned_changes_entry = "Active planned changes"
require_feature_audit = true
require_previous_milestones_closed = true
refresh_on_close = true
